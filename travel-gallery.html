<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Pics | Bridgeman Downs Residents Hub</title>
  <style>
    :root {
      --hub-navy:       #263746;
      --hub-navy-panel: #2E4256;
      --hub-navy-hover: #324A5F;
      --hub-gold:       #D4B860;
      --hub-cream:      #F6F2E7;
      --hub-muted:      #B9AF9C;
      --hub-charcoal:   #3F4143;
      --hub-green:      #5fb87e;
      --hub-red:        #e8998c;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:var(--hub-navy); min-height:100vh; }
    .top-bar {
      background:var(--hub-navy-panel); padding:12px 20px;
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:10px;
    }
    .top-bar-title { color:var(--hub-cream); font-size:1em; font-weight:700; }
    .top-bar-sub   { color:rgba(246,242,231,0.72); font-size:0.8em; margin-top:2px; }
    .back-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:var(--hub-gold); color:var(--hub-navy); border:none;
      border-radius:6px; padding:8px 16px;
      font-size:0.95rem; font-family:'Segoe UI',Arial,sans-serif;
      cursor:pointer; text-decoration:none; font-weight:700;
    }
    .back-btn:hover { background:#c2a44f; }
    .content { max-width:920px; margin:0 auto; padding:24px 16px 60px; }
    .share-cta {
      background:var(--hub-navy-panel); color:var(--hub-cream); border-radius:10px;
      padding:18px 22px; margin-bottom:22px; border-left:4px solid var(--hub-gold);
      display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    }
    .share-cta p { font-size:0.92em; opacity:0.9; max-width:520px; }
    .share-cta a.btn {
      background:var(--hub-gold); color:var(--hub-navy); font-weight:700; text-decoration:none;
      padding:10px 18px; border-radius:7px; font-size:0.9em; white-space:nowrap;
    }
    .album-card {
      background:var(--hub-navy-panel); border-radius:12px; border:2px solid var(--hub-charcoal);
      box-shadow:0 2px 8px rgba(0,0,0,0.25); overflow:hidden; margin-bottom:18px;
    }
    .album-header {
      background:var(--hub-navy); padding:14px 20px;
      display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    }
    .album-title { font-weight:700; color:var(--hub-cream); font-size:1em; }
    .album-meta { font-size:0.8em; color:var(--hub-muted); margin-top:2px; }
    .album-toggle { font-size:1.2em; color:var(--hub-gold); transition:transform 0.2s; }
    .album-toggle.open { transform:rotate(180deg); }
    .album-grid {
      display:none; grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
      gap:10px; padding:18px 20px;
    }
    .album-grid.open { display:grid; }
    .thumb {
      position:relative; border-radius:8px; overflow:hidden; cursor:pointer;
      aspect-ratio:1/1; background:#222;
    }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .thumb .play-icon {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:2em; color:white; text-shadow:0 1px 4px rgba(0,0,0,0.6); pointer-events:none;
    }
    .thumb .credit {
      position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.55);
      color:white; font-size:0.72em; padding:3px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .empty-state { text-align:center; color:var(--hub-muted); padding:50px 20px; font-size:0.95em; }
    .lightbox {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.88);
      z-index:1000; align-items:center; justify-content:center; padding:20px;
    }
    .lightbox.show { display:flex; }
    .lightbox img, .lightbox iframe { max-width:100%; max-height:85vh; border-radius:6px; border:none; }
    .lightbox iframe { width:80vw; height:70vh; }
    .lightbox-close {
      position:absolute; top:18px; right:24px; color:white; font-size:2em;
      cursor:pointer; background:none; border:none; line-height:1;
    }
    .lightbox-nav {
      position:absolute; top:50%; transform:translateY(-50%);
      width:56px; height:56px; border-radius:50%;
      background:rgba(255,255,255,0.12); color:white; border:none;
      font-size:1.6em; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background 0.2s;
    }
    .lightbox-nav:hover { background:rgba(255,255,255,0.28); }
    .lightbox-nav.hide { display:none; }
    .lightbox-prev { left:16px; }
    .lightbox-next { right:16px; }
    @media(max-width:600px){ .lightbox-nav { width:44px; height:44px; font-size:1.3em; } .lightbox-prev { left:6px; } .lightbox-next { right:6px; } }
    .lightbox-inner { display:flex; flex-direction:column; align-items:center; gap:10px; max-width:100%; }
    .lightbox-counter { color:var(--hub-muted); font-size:0.85em; margin-top:-4px; }
    .lightbox-actions { display:flex; gap:10px; }
    .lightbox-actions button {
      background:var(--hub-navy-panel); color:var(--hub-cream); border:2px solid var(--hub-charcoal);
      border-radius:7px; padding:8px 16px; font-size:0.85em; font-weight:700; cursor:pointer;
      font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    }
    .lightbox-actions button:hover { border-color:var(--hub-gold); }
    .lightbox-form {
      display:none; background:var(--hub-navy-panel); border:2px solid var(--hub-charcoal);
      border-radius:8px; padding:16px 18px; width:min(360px, 90vw); color:var(--hub-cream);
    }
    .lightbox-form.open { display:block; }
    .lightbox-form p { font-size:0.85em; opacity:0.9; margin-bottom:10px; line-height:1.5; }
    .lightbox-form label { display:block; font-size:0.78em; font-weight:700; margin:8px 0 4px; }
    .lightbox-form input, .lightbox-form select {
      width:100%; padding:8px 10px; font-size:0.9em; border-radius:5px; border:2px solid var(--hub-charcoal);
      color:#222; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    }
    .lightbox-form-btns { display:flex; align-items:center; gap:10px; margin-top:12px; }
    .lightbox-form-btns button {
      border:none; border-radius:6px; padding:8px 16px; font-size:0.85em; font-weight:700; cursor:pointer;
      font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    }
    .btn-confirm-action { background:var(--hub-gold); color:var(--hub-navy); }
    .btn-cancel-action  { background:transparent; color:var(--hub-cream); border:2px solid var(--hub-charcoal) !important; }
    .lightbox-status { font-size:0.82em; }
    .lightbox-status.err { color:var(--hub-red); }
    .lightbox-status.ok  { color:var(--hub-green); }
    .lightbox-img-fallback {
      color:var(--hub-cream); background:var(--hub-navy-panel); border:2px solid var(--hub-charcoal);
      border-radius:8px; padding:20px 24px; text-align:center; font-size:0.92em; max-width:360px;
    }
    .lightbox-img-fallback a { color:var(--hub-gold); font-weight:700; }
    @media(max-width:480px){ .top-bar { padding:10px 14px; } .back-btn { font-size:0.82em; padding:8px 12px; } }
  </style>
</head>
<body>

<div class="top-bar">
  <div>
    <div class="top-bar-title">&#9992;&#65039; Travel Pics</div>
    <div class="top-bar-sub">Bridgeman Downs Residents Hub</div>
  </div>
  <button class="back-btn" onclick="history.back()">← Back</button>
</div>

<div class="content">

  <div class="share-cta">
    <p>Been on a trip you'd like to share? Add your photos or video here for everyone to enjoy.
    <br>This gallery is for personal holiday and travel photos — for photos from a BDRV event, see
    <a href="event-gallery.html" style="color:var(--hub-gold);">Event Photos &amp; Videos</a> instead.</p>
    <a class="btn" href="travel-photos-submit.html">✈️ Share Travel Pics</a>
  </div>

  <div id="galleryWrap">
    <div class="empty-state">Loading gallery…</div>
  </div>

</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" onclick="lightboxPrev(event)">&#10094;</button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" onclick="lightboxNext(event)">&#10095;</button>
  <div id="lightboxContent"></div>
</div>

<script>
  // Same dedicated Travel Media Apps Script deployment used by travel-photos-submit.html
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx8SRC9F3dNIZ3z8XQeeESOe-wkWOmzJLqQjEyDvy7h41tHmCPVYg1K4xeXFPtPY_Ny/exec';

  // Records the resident's last visit, in case a "new content" badge is
  // added for Travel Pics later (matching the one on Event Photos &
  // Videos). Not read by anything yet, but harmless to set now.
  localStorage.setItem('travelGalleryLastVisit', Date.now().toString());

  function thumbUrl(fileId)  { return 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w400'; }
  function largeUrl(fileId)  { return 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1200'; }
  function previewUrl(fileId){ return 'https://drive.google.com/file/d/' + fileId + '/preview'; }

  var galleryData        = {};   // { albumName: [item, ...] } — from the server, unsorted
  var sortedItemsByAlbum = {};   // { albumName: [item, ...] } — same order shown in the grid
  var lightboxAlbumName  = null;
  var lightboxIndex      = -1;
  var lightboxItem       = null; // the item currently open in the lightbox

  function esc(str) {
    return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Safely embeds a JSON value inside a single-quoted HTML attribute
  function jsonForAttr(val) {
    return JSON.stringify(val).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
  }

  function openLightbox(albumName, idx) {
    var items = sortedItemsByAlbum[albumName] || [];
    if (!items.length) return;
    idx = ((idx % items.length) + items.length) % items.length; // wrap around at either end
    var item = items[idx];

    lightboxAlbumName = albumName;
    lightboxIndex      = idx;
    lightboxItem        = Object.assign({ albumName: albumName }, item);

    var el = document.getElementById('lightboxContent');

    function driveViewUrl(fileId) { return 'https://drive.google.com/file/d/' + fileId + '/view'; }

    var mediaHtml = item.type === 'video'
      ? '<iframe src="' + previewUrl(item.fileId) + '" allow="autoplay"></iframe>'
      : '<img src="' + largeUrl(item.fileId) + '" alt="" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';">' +
        '<div class="lightbox-img-fallback" style="display:none;">Sorry, this photo is taking too long to load. ' +
        '<a href="' + driveViewUrl(item.fileId) + '" target="_blank" rel="noopener">Open it in Google Drive instead</a>.</div>';

    var albumOptions = Object.keys(galleryData).map(function(name){
      var sel = name === albumName ? ' selected' : '';
      return '<option value="' + esc(name) + '"' + sel + '>' + esc(name) + '</option>';
    }).join('');

    el.innerHTML =
      '<div class="lightbox-inner">' +
        mediaHtml +
        (items.length > 1 ? '<div class="lightbox-counter">' + (idx + 1) + ' of ' + items.length + '</div>' : '') +
        '<div class="lightbox-actions">' +
          '<button onclick="toggleLightboxForm(\'edit\')">✏️ Edit</button>' +
          '<button onclick="toggleLightboxForm(\'delete\')">🗑️ Delete</button>' +
        '</div>' +

        '<div class="lightbox-form" id="lb-edit-form">' +
          '<p>To edit this item, confirm the name and unit number you submitted it with, then update the details below.</p>' +
          '<label>Your name</label><input type="text" id="lb-edit-name" placeholder="Name used when submitting">' +
          '<label>Unit number</label><input type="text" id="lb-edit-unit" placeholder="Unit used when submitting">' +
          '<label>Photo credit</label><input type="text" id="lb-edit-credit" value="' + esc(item.uploader) + '">' +
          '<label>Album</label><select id="lb-edit-album">' + albumOptions + '</select>' +
          '<div class="lightbox-form-btns">' +
            '<button class="btn-confirm-action" onclick="confirmEditMedia()">Save Changes</button>' +
            '<button class="btn-cancel-action" onclick="toggleLightboxForm(\'edit\')">Cancel</button>' +
          '</div>' +
          '<div class="lightbox-status" id="lb-edit-status" style="margin-top:8px;"></div>' +
        '</div>' +

        '<div class="lightbox-form" id="lb-delete-form">' +
          '<p>To delete this item, confirm the name and unit number you submitted it with.</p>' +
          '<label>Your name</label><input type="text" id="lb-delete-name" placeholder="Name used when submitting">' +
          '<label>Unit number</label><input type="text" id="lb-delete-unit" placeholder="Unit used when submitting">' +
          '<div class="lightbox-form-btns">' +
            '<button class="btn-confirm-action" onclick="confirmDeleteMedia()">Confirm Delete</button>' +
            '<button class="btn-cancel-action" onclick="toggleLightboxForm(\'delete\')">Cancel</button>' +
          '</div>' +
          '<div class="lightbox-status" id="lb-delete-status" style="margin-top:8px;"></div>' +
        '</div>' +
      '</div>';

    // Only show the arrows when there's more than one item to cycle through
    var showNav = items.length > 1;
    document.getElementById('lightboxPrev').classList.toggle('hide', !showNav);
    document.getElementById('lightboxNext').classList.toggle('hide', !showNav);

    document.getElementById('lightbox').classList.add('show');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('show');
    document.getElementById('lightboxContent').innerHTML = '';
    lightboxItem = null;
    lightboxAlbumName = null;
    lightboxIndex = -1;
  }
  document.getElementById('lightbox').addEventListener('click', function(e){
    if (e.target === this) closeLightbox();
  });

  function lightboxPrev(e) { if (e) e.stopPropagation(); if (lightboxAlbumName) openLightbox(lightboxAlbumName, lightboxIndex - 1); }
  function lightboxNext(e) { if (e) e.stopPropagation(); if (lightboxAlbumName) openLightbox(lightboxAlbumName, lightboxIndex + 1); }

  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('lightbox').classList.contains('show')) return;
    if (e.key === 'ArrowLeft')  lightboxPrev();
    else if (e.key === 'ArrowRight') lightboxNext();
    else if (e.key === 'Escape')     closeLightbox();
  });

  function toggleLightboxForm(which) {
    var thisForm  = document.getElementById('lb-' + which + '-form');
    var otherForm = document.getElementById('lb-' + (which === 'edit' ? 'delete' : 'edit') + '-form');
    thisForm.classList.toggle('open');
    otherForm.classList.remove('open');
  }

  function toggleAlbum(idx) {
    document.getElementById('grid-' + idx).classList.toggle('open');
    document.getElementById('toggle-' + idx).classList.toggle('open');
  }

  function renderGallery() {
    var wrap = document.getElementById('galleryWrap');
    var albumNames = Object.keys(galleryData).filter(function(n){ return galleryData[n].length > 0; });

    if (!albumNames.length) {
      wrap.innerHTML = '<div class="empty-state">No travel photos or videos have been shared yet — be the first!</div>';
      return;
    }

    // Sort albums by most recent item first
    albumNames.sort(function(a, b){
      var latestA = Math.max.apply(null, galleryData[a].map(function(i){ return new Date(i.date).getTime(); }));
      var latestB = Math.max.apply(null, galleryData[b].map(function(i){ return new Date(i.date).getTime(); }));
      return latestB - latestA;
    });

    var html = '';
    albumNames.forEach(function(albumName, idx){
      var items = galleryData[albumName].slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
      sortedItemsByAlbum[albumName] = items;

      html += '<div class="album-card">';
      html += '  <div class="album-header" onclick="toggleAlbum(' + idx + ')">';
      html += '    <div><div class="album-title">' + esc(albumName) + '</div><div class="album-meta">' + items.length + ' item' + (items.length===1?'':'s') + '</div></div>';
      html += '    <div class="album-toggle" id="toggle-' + idx + '">▾</div>';
      html += '  </div>';
      html += '  <div class="album-grid" id="grid-' + idx + '">';
      items.forEach(function(item, i){
        html += '<div class="thumb" onclick=\'openLightbox(' + jsonForAttr(albumName) + ', ' + i + ')\'>';
        html += '  <img src="' + thumbUrl(item.fileId) + '" loading="lazy" alt="">';
        if (item.type === 'video') html += '<div class="play-icon">▶</div>';
        if (item.uploader) html += '<div class="credit">' + esc(item.uploader) + '</div>';
        html += '</div>';
      });
      html += '  </div>';
      html += '</div>';
    });

    wrap.innerHTML = html;
    // Open the most recent album by default
    if (albumNames.length) { toggleAlbum(0); }
  }

  function confirmDeleteMedia() {
    var name   = document.getElementById('lb-delete-name').value.trim();
    var unit   = document.getElementById('lb-delete-unit').value.trim();
    var status = document.getElementById('lb-delete-status');

    if (!name || !unit) {
      status.className = 'lightbox-status err';
      status.textContent = '⚠️ Please enter both your name and unit number.';
      return;
    }

    status.className = 'lightbox-status';
    status.textContent = 'Deleting…';

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'deleteMedia', fileId: lightboxItem.fileId, name: name, unit: unit })
    })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data.status !== 'ok') {
          status.className = 'lightbox-status err';
          status.textContent = '❌ ' + (data.message || 'Something went wrong.');
          return;
        }
        // Remove from local data and re-render
        var list = galleryData[lightboxItem.albumName] || [];
        galleryData[lightboxItem.albumName] = list.filter(function(i){ return i.fileId !== lightboxItem.fileId; });
        status.className = 'lightbox-status ok';
        status.textContent = 'Deleted ✅';
        setTimeout(function(){ closeLightbox(); renderGallery(); }, 700);
      })
      .catch(function(){
        status.className = 'lightbox-status err';
        status.textContent = '❌ Something went wrong. Please try again.';
      });
  }

  function confirmEditMedia() {
    var name      = document.getElementById('lb-edit-name').value.trim();
    var unit      = document.getElementById('lb-edit-unit').value.trim();
    var newCredit = document.getElementById('lb-edit-credit').value.trim();
    var newAlbum  = document.getElementById('lb-edit-album').value;
    var status    = document.getElementById('lb-edit-status');

    if (!name || !unit) {
      status.className = 'lightbox-status err';
      status.textContent = '⚠️ Please enter both your name and unit number.';
      return;
    }
    if (!newCredit) {
      status.className = 'lightbox-status err';
      status.textContent = '⚠️ Photo credit can\'t be blank.';
      return;
    }

    status.className = 'lightbox-status';
    status.textContent = 'Saving…';

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'editMedia',
        fileId: lightboxItem.fileId,
        name: name,
        unit: unit,
        newUploaderName: newCredit,
        newAlbumName: newAlbum
      })
    })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data.status !== 'ok') {
          status.className = 'lightbox-status err';
          status.textContent = '❌ ' + (data.message || 'Something went wrong.');
          return;
        }
        // Update local data and re-render
        var oldList = galleryData[lightboxItem.albumName] || [];
        galleryData[lightboxItem.albumName] = oldList.filter(function(i){ return i.fileId !== lightboxItem.fileId; });
        var updated = Object.assign({}, lightboxItem, { uploader: newCredit });
        delete updated.albumName;
        if (!galleryData[newAlbum]) galleryData[newAlbum] = [];
        galleryData[newAlbum].push(updated);

        status.className = 'lightbox-status ok';
        status.textContent = 'Saved ✅';
        setTimeout(function(){ closeLightbox(); renderGallery(); }, 700);
      })
      .catch(function(){
        status.className = 'lightbox-status err';
        status.textContent = '❌ Something went wrong. Please try again.';
      });
  }

  fetch(SCRIPT_URL + '?action=gallery')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.status !== 'ok' || !data.albums || !Object.keys(data.albums).length) {
        document.getElementById('galleryWrap').innerHTML = '<div class="empty-state">No travel photos or videos have been shared yet — be the first!</div>';
        return;
      }
      galleryData = data.albums;
      renderGallery();
    })
    .catch(function(){
      document.getElementById('galleryWrap').innerHTML = '<div class="empty-state">Could not load the gallery right now — please try again shortly.</div>';
    });
</script>

</body>
</html>
