<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facility Calendar — Printable Schedule</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --hub-navy: #263746;
    --hub-navy-panel: #2E4256;
    --hub-navy-hover: #324A5F;
    --hub-gold: #D4B860;
    --hub-cream: #F6F2E7;
    --hub-charcoal: #3F4143;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--hub-navy); color: var(--hub-cream); font-size: 15px; line-height: 1.4;
  }

  .back-bar { background: var(--hub-navy-panel); padding: 10px 20px; border-bottom: 2px solid var(--hub-charcoal); }
  .back-bar a {
    color: var(--hub-navy); background: var(--hub-gold); border: none; border-radius: 10px;
    padding: 7px 16px; text-decoration: none; font-weight: 700; font-size: 15px;
    display: inline-flex; align-items: center; gap: 6px;
  }

  .controls {
    max-width: 900px; margin: 20px auto 0; padding: 16px 20px;
    background: var(--hub-navy-panel); border-radius: 12px; border: 1px solid var(--hub-charcoal);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .controls h1 { color: var(--hub-gold); font-size: 1.15em; margin-right: auto; }
  .toggle-group { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--hub-gold); }
  .toggle-group button {
    border: none; background: var(--hub-navy-panel); color: var(--hub-gold); padding: 8px 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; font-size: 0.9em;
  }
  .toggle-group button.active { background: var(--hub-gold); color: var(--hub-navy); }
  .nav-btn {
    border: 1px solid var(--hub-charcoal); background: var(--hub-navy); color: var(--hub-gold); border-radius: 7px;
    padding: 7px 12px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.95em;
  }
  .range-label { font-weight: 700; color: var(--hub-cream); min-width: 190px; text-align: center; }
  .print-btn {
    background: #a12b2b; color: white; border: none; border-radius: 8px;
    padding: 9px 18px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.95em;
  }

  #loading { text-align: center; padding: 40px; color: var(--hub-cream); opacity: 0.7; }

  /* The "paper" preview stays white/light regardless of the page's own navy
     theme — same idea as the black-on-white print override already used
     elsewhere on the Hub, so nothing here wastes toner when printed. */
  .sheet { max-width: 900px; margin: 20px auto 60px; background: white; color: #222; border-radius: 12px; border: 1px solid #c5d8ee; padding: 24px 26px; }

  .sheet-title { text-align: center; color: var(--hub-navy); font-size: 1.3em; font-weight: 800; margin-bottom: 4px; }
  .sheet-subtitle { text-align: center; color: #777; font-size: 0.85em; margin-bottom: 18px; }

  .week-divider {
    background: #1F4E79; color: white; font-weight: 700; font-size: 0.9em;
    padding: 6px 12px; border-radius: 6px; margin: 18px 0 10px;
  }
  .week-divider:first-child { margin-top: 0; }

  .day-block { margin-bottom: 14px; border: 1px solid #c5d8ee; border-radius: 8px; overflow: hidden; }
  .day-heading {
    background: #D9E1F2; color: #1F4E79; font-weight: 700; padding: 7px 12px; font-size: 0.98em;
  }
  .day-heading.weekend { background: #FCE4D6; }
  .day-heading.today { outline: 2px solid #a12b2b; outline-offset: -2px; }

  table.day-table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
  table.day-table th {
    text-align: left; padding: 5px 10px; font-size: 0.75em; text-transform: uppercase;
    letter-spacing: 0.03em; color: #666; border-bottom: 1px solid #e0eaf4; font-style: italic;
  }
  table.day-table td { padding: 5px 10px; border-bottom: 1px solid #eef3f8; }
  table.day-table tr:last-child td { border-bottom: none; }
  .no-activities { padding: 10px 12px; color: #999; font-style: italic; font-size: 0.88em; }

  @media print {
    body { background: white; }
    .back-bar, .controls { display: none !important; }
    .sheet { border: none; box-shadow: none; margin: 0; padding: 0; max-width: 100%; }
    .week-divider { break-before: page; }
    .week-divider:first-child { break-before: auto; }
    .day-block { break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="back-bar"><a href="members-area.html">← Back to Members Area</a></div>

<div class="controls">
  <h1>🖨️ Printable Schedule</h1>
  <div class="toggle-group">
    <button id="btn-week" class="active" onclick="setMode('week')">Week</button>
    <button id="btn-month" onclick="setMode('month')">Month</button>
  </div>
  <button class="nav-btn" onclick="navigate(-1)">◀</button>
  <div class="range-label" id="range-label">—</div>
  <button class="nav-btn" onclick="navigate(1)">▶</button>
  <button class="nav-btn" onclick="goToday()">Today</button>
  <button class="print-btn" onclick="window.print()">🖨️ Print</button>
</div>

<div id="loading">Loading…</div>
<div class="sheet" id="sheet" style="display:none;">
  <div class="sheet-title" id="sheet-title"></div>
  <div class="sheet-subtitle">Bridgeman Downs Retirement Village — Facility Calendar</div>
  <div id="sheet-body"></div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzsMFnQXBPNfdXnKvU4lju_2LIU5QangsqQwq_NXFYu2r9GA1dhZp0x_H2sf9iFrHcHA/exec";
const SECRET_KEY = "zwQQcGAflBHjDc91l3DZceVf";

let allRows = [];
let mode = "week"; // "week" | "month"
let anchor = new Date(); // any date within the currently-shown week/month

function apiGet(action, extra) {
  const params = new URLSearchParams(Object.assign({ action, key: SECRET_KEY }, extra || {}));
  return fetch(APPS_SCRIPT_URL + "?" + params.toString()).then(r => r.json());
}

function loadAndRender() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("sheet").style.display = "none";
  apiGet("list").then(res => {
    document.getElementById("loading").style.display = "none";
    document.getElementById("sheet").style.display = "block";
    if (!res.success) { document.getElementById("sheet-body").innerHTML = "Couldn't load: " + res.error; return; }
    allRows = res.rows;
    render();
  }).catch(err => {
    document.getElementById("loading").textContent = "Couldn't reach the calendar service: " + err;
  });
}

function setMode(m) {
  mode = m;
  document.getElementById("btn-week").classList.toggle("active", m === "week");
  document.getElementById("btn-month").classList.toggle("active", m === "month");
  render();
}
function navigate(dir) {
  if (mode === "week") anchor.setDate(anchor.getDate() + dir * 7);
  else anchor.setMonth(anchor.getMonth() + dir);
  render();
}
function goToday() { anchor = new Date(); render(); }

function toDateStr(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function startOfWeek(d) {
  const r = new Date(d);
  r.setDate(r.getDate() - r.getDay()); // back to Sunday
  return r;
}
function fmtLong(d) {
  return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function render() {
  const rowsByDate = {};
  allRows.forEach(r => { (rowsByDate[r.date] = rowsByDate[r.date] || []).push(r); });

  let days = [];
  let title = "";

  if (mode === "week") {
    const start = startOfWeek(anchor);
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(d.getDate() + i);
      days.push(d);
    }
    const end = days[6];
    title = "Week of " + start.toLocaleDateString(undefined,{day:"numeric",month:"short"}) +
            " – " + end.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    document.getElementById("range-label").textContent = title;
  } else {
    const y = anchor.getFullYear(), m = anchor.getMonth();
    const first = new Date(y, m, 1);
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < daysInMonth; i++) days.push(new Date(y, m, i + 1));
    title = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    document.getElementById("range-label").textContent = title;
  }

  document.getElementById("sheet-title").textContent = title;

  const todayStr = toDateStr(new Date());
  const body = document.getElementById("sheet-body");
  body.innerHTML = "";

  days.forEach((d, idx) => {
    // In month mode, drop a week divider every 7 days so printing paginates one week per page
    if (mode === "month" && idx % 7 === 0) {
      const div = document.createElement("div");
      div.className = "week-divider";
      const weekEnd = days[Math.min(idx + 6, days.length - 1)];
      div.textContent = "Week of " + d.toLocaleDateString(undefined,{day:"numeric",month:"short"}) +
                         " – " + weekEnd.toLocaleDateString(undefined,{day:"numeric",month:"short"});
      body.appendChild(div);
    }

    const dateStr = toDateStr(d);
    const dayRows = (rowsByDate[dateStr] || []).slice();
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = dateStr === todayStr;

    const block = document.createElement("div");
    block.className = "day-block";
    block.innerHTML = `<div class="day-heading ${isWeekend ? "weekend" : ""} ${isToday ? "today" : ""}">${fmtLong(d)}</div>`;

    if (dayRows.length === 0) {
      block.innerHTML += `<div class="no-activities">Nothing scheduled</div>`;
    } else {
      const table = document.createElement("table");
      table.className = "day-table";
      table.innerHTML = `<thead><tr><th>Time</th><th>Duration</th><th>Activity / Event</th><th>Venue</th><th>Contact</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector("tbody");
      dayRows.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${esc(r.time)}</td><td>${esc(r.duration)}</td><td>${esc(r.activity)}</td><td>${esc(r.venue)}</td><td>${esc(r.contact)}</td>`;
        tbody.appendChild(tr);
      });
      block.appendChild(table);
    }
    body.appendChild(block);
  });
}

function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

loadAndRender();
</script>
</body>
</html>
