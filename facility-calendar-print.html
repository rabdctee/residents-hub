<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Village Calendar</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --hub-navy: #263746;
    --hub-navy-panel: #2E4256;
    --hub-navy-hover: #324A5F;
    --hub-gold: #D4B860;
    --hub-cream: #F6F2E7;
    --hub-charcoal: #3F4143;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--hub-navy); color: var(--hub-cream); font-size: 15px; line-height: 1.4;
  }

  .back-bar { background: var(--hub-navy-panel); padding: 10px 20px; border-bottom: 2px solid var(--hub-charcoal); }
  .back-bar a {
    color: var(--hub-navy); background: var(--hub-gold); border: none; border-radius: 10px;
    padding: 7px 16px; text-decoration: none; font-weight: 700; font-size: 15px;
    display: inline-flex; align-items: center; gap: 6px;
  }

  .controls {
    max-width: 1100px; margin: 20px auto 0; padding: 16px 20px;
    background: var(--hub-navy-panel); border-radius: 12px; border: 1px solid var(--hub-charcoal);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .controls h1 { color: var(--hub-gold); font-size: 1.15em; margin-right: auto; }
  .toggle-group { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--hub-gold); }
  .toggle-group button {
    border: none; background: var(--hub-navy-panel); color: var(--hub-gold); padding: 8px 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; font-size: 0.9em;
  }
  .toggle-group button.active { background: var(--hub-gold); color: var(--hub-navy); }
  .nav-btn {
    border: 1px solid var(--hub-charcoal); background: var(--hub-navy); color: var(--hub-gold); border-radius: 7px;
    padding: 7px 12px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.95em;
  }
  .range-label { font-weight: 700; color: var(--hub-cream); min-width: 190px; text-align: center; }
  .print-btn {
    background: #a12b2b; color: white; border: none; border-radius: 8px;
    padding: 9px 18px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.95em;
  }
  .print-hint { font-size: 0.78em; color: var(--hub-cream); opacity: 0.7; width: 100%; }

  #loading { text-align: center; padding: 40px; color: var(--hub-cream); opacity: 0.7; }

  /* The "paper" preview stays white/light regardless of the page's own navy
     theme — same idea as the black-on-white print override already used
     elsewhere on the Hub, so nothing wastes toner when printed. */
  .sheet { max-width: 1100px; margin: 20px auto 60px; background: white; color: #222; border-radius: 12px; border: 1px solid #c5d8ee; padding: 20px 22px; }

  .sheet-title { text-align: center; color: var(--hub-navy); font-size: 1.3em; font-weight: 800; margin-bottom: 2px; }
  .sheet-subtitle { text-align: center; color: #777; font-size: 0.85em; margin-bottom: 14px; }

  .weekday-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .weekday-header div {
    text-align: center; font-weight: 700; font-size: 0.78em; text-transform: uppercase;
    color: var(--hub-navy); padding: 4px 0; letter-spacing: 0.03em;
  }
  .mode-week .weekday-header { display: none; }

  /* ── Week mode: stacked day-by-day list ── */
  .day-block { margin-bottom: 16px; border: 1px solid #c5d8ee; border-radius: 8px; overflow: hidden; }
  .day-heading {
    background: #D9E1F2; color: #1F4E79; font-weight: 700; padding: 10px 14px; font-size: 1.15em;
  }
  .day-heading.weekend { background: #FCE4D6; }
  .day-heading.today { outline: 2px solid #a12b2b; outline-offset: -2px; }
  table.day-table { width: 100%; border-collapse: collapse; font-size: 1em; }
  table.day-table th {
    text-align: left; padding: 7px 14px; font-size: 0.75em; text-transform: uppercase;
    letter-spacing: 0.03em; color: #666; border-bottom: 1px solid #e0eaf4; font-style: italic;
  }
  table.day-table td { padding: 8px 14px; border-bottom: 1px solid #eef3f8; }
  table.day-table tr:last-child td { border-bottom: none; }
  .no-activities { padding: 12px 14px; color: #999; font-style: italic; font-size: 0.95em; }

  .week-row { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 1fr; gap: 4px; margin-bottom: 4px; }

  .cal-cell {
    border: 1px solid #c5d8ee; border-radius: 6px; padding: 5px 6px; background: white;
    cursor: pointer; overflow: hidden; display: flex; flex-direction: column;
  }
  .cal-cell:hover { background: #f4f8fd; }
  .cal-cell.empty { background: #f7f7f7; cursor: default; border-style: dashed; }
  .cal-cell.weekend { background: #fdf5ea; }
  .cal-cell.today { border: 2px solid #a12b2b; }
  .cal-cell .daynum { font-weight: 800; font-size: 0.85em; color: var(--hub-navy); margin-bottom: 2px; }
  .cal-cell .entry {
    font-size: 0.66em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-cell .more { font-size: 0.64em; color: #888; font-style: italic; margin-top: 1px; }

  /* Month mode: compact cells, one row per week, several weeks per page */
  .mode-month .cal-cell { min-height: 92px; }

  /* ── Click-for-detail modal (screen only, never printed) ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    align-items: center; justify-content: center; z-index: 999; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: white; border-radius: 10px; max-width: 480px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal-header {
    background: var(--hub-navy); color: white; padding: 12px 16px; border-radius: 10px 10px 0 0;
    display: flex; justify-content: space-between; align-items: center; font-weight: 700;
  }
  .modal-header button { background: none; border: none; color: white; font-size: 1.2em; cursor: pointer; }
  .modal-body { padding: 12px 16px; }
  .modal-entry { padding: 8px 0; border-bottom: 1px solid #eef3f8; font-size: 0.92em; }
  .modal-entry:last-child { border-bottom: none; }
  .modal-entry .m-activity { font-weight: 700; color: var(--hub-navy); }
  .modal-entry .m-meta { color: #777; font-size: 0.9em; }

  @media print {
    body { background: white; }
    .back-bar, .controls, .modal-overlay { display: none !important; }
    .sheet { border: none; box-shadow: none; margin: 0; padding: 0; max-width: 100%; }
    .week-row { break-inside: avoid; }
    .cal-cell { cursor: default; }
    .cal-cell:hover { background: inherit; }

    /* Month printing shows every activity in full — no "+N more" summaries,
       since that's not clickable on paper. Cells grow to fit whatever they need. */
    .cal-cell { overflow: visible; }
    .cal-cell .entry { white-space: normal; overflow: visible; text-overflow: clip; }
    .cal-cell .more { display: none; }

    /* Week view (stacked list) prints larger and bolder for noticeboard reading */
    .mode-week .sheet-title { font-size: 2em; }
    .mode-week .sheet-subtitle { font-size: 1.1em; margin-bottom: 20px; }
    .mode-week .day-heading { font-size: 1.4em; padding: 12px 16px; }
    .mode-week table.day-table { font-size: 1.15em; }
    .mode-week table.day-table th { font-size: 0.8em; padding: 8px 16px; }
    .mode-week table.day-table td { padding: 10px 16px; }
    .mode-week .day-block { break-inside: avoid; }
  }
  /* Week prints portrait (a stacked list reads better tall); Month prints
     landscape (needs the width for 7 columns) via a named page. */
  @page { size: portrait; margin: 10mm; }
  @page monthpage { size: landscape; margin: 10mm; }
  .sheet.mode-month { page: monthpage; }
</style>
</head>
<body>

<div class="back-bar"><a href="index.html">← Back to Home</a></div>

<div class="controls">
  <h1>🖨️ Printable Calendar</h1>
  <div class="toggle-group">
    <button id="btn-week" class="active" onclick="setMode('week')">Week</button>
    <button id="btn-month" onclick="setMode('month')">Month</button>
  </div>
  <button class="nav-btn" onclick="navigate(-1)">◀</button>
  <div class="range-label" id="range-label">—</div>
  <button class="nav-btn" onclick="navigate(1)">▶</button>
  <button class="nav-btn" onclick="goToday()">Today</button>
  <button class="print-btn" onclick="window.print()">🖨️ Print</button>
  <div class="print-hint">Tip: in the print dialog, open "More settings" and untick "Headers and footers" to drop the browser's own URL/date line.</div>
</div>

<div id="loading">Loading…</div>
<div class="sheet" id="sheet" style="display:none;">
  <div class="sheet-title" id="sheet-title"></div>
  <div class="sheet-subtitle">Bridgeman Downs Retirement Village</div>
  <div class="weekday-header">
    <div>Sunday</div><div>Monday</div><div>Tuesday</div><div>Wednesday</div><div>Thursday</div><div>Friday</div><div>Saturday</div>
  </div>
  <div id="sheet-body"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header"><span id="modal-title"></span><button onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzsMFnQXBPNfdXnKvU4lju_2LIU5QangsqQwq_NXFYu2r9GA1dhZp0x_H2sf9iFrHcHA/exec";
const SECRET_KEY = "zwQQcGAflBHjDc91l3DZceVf";

let allRows = [];
let rowsByDate = {};
let mode = "week"; // "week" | "month"
let anchor = new Date();
let printing = false; // true only while the print dialog is open — shows every entry, no "+N more"

window.addEventListener("beforeprint", () => { printing = true; render(); });
window.addEventListener("afterprint", () => { printing = false; render(); });

function apiGet(action, extra) {
  const params = new URLSearchParams(Object.assign({ action, key: SECRET_KEY }, extra || {}));
  return fetch(APPS_SCRIPT_URL + "?" + params.toString()).then(r => r.json());
}

function loadAndRender() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("sheet").style.display = "none";
  apiGet("list").then(res => {
    document.getElementById("loading").style.display = "none";
    document.getElementById("sheet").style.display = "block";
    if (!res.success) { document.getElementById("sheet-body").innerHTML = "Couldn't load: " + res.error; return; }
    allRows = res.rows;
    rowsByDate = {};
    allRows.forEach(r => { (rowsByDate[r.date] = rowsByDate[r.date] || []).push(r); });
    render();
  }).catch(err => {
    document.getElementById("loading").textContent = "Couldn't reach the calendar service: " + err;
  });
}

function setMode(m) {
  mode = m;
  document.getElementById("btn-week").classList.toggle("active", m === "week");
  document.getElementById("btn-month").classList.toggle("active", m === "month");
  render();
}
function navigate(dir) {
  if (mode === "week") anchor.setDate(anchor.getDate() + dir * 7);
  else anchor.setMonth(anchor.getMonth() + dir);
  render();
}
function goToday() { anchor = new Date(); render(); }

function toDateStr(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function startOfWeek(d) {
  const r = new Date(d);
  r.setDate(r.getDate() - r.getDay());
  return r;
}

function fmtLong(d) {
  return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function render() {
  const sheet = document.getElementById("sheet");
  sheet.classList.toggle("mode-week", mode === "week");
  sheet.classList.toggle("mode-month", mode === "month");

  if (mode === "week") renderWeekList();
  else renderMonthGrid();
}

// ── Week mode: stacked day-by-day list ──
function renderWeekList() {
  const body = document.getElementById("sheet-body");
  body.innerHTML = "";
  const todayStr = toDateStr(new Date());

  const start = startOfWeek(anchor);
  const days = [];
  for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(d.getDate() + i); days.push(d); }
  const end = days[6];
  const title = "Week of " + start.toLocaleDateString(undefined,{day:"numeric",month:"short"}) +
                " – " + end.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
  document.getElementById("range-label").textContent = title;
  document.getElementById("sheet-title").textContent = title;

  days.forEach(d => {
    const dateStr = toDateStr(d);
    const dayRows = (rowsByDate[dateStr] || []).slice();
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = dateStr === todayStr;

    const block = document.createElement("div");
    block.className = "day-block";
    block.innerHTML = `<div class="day-heading ${isWeekend ? "weekend" : ""} ${isToday ? "today" : ""}">${fmtLong(d)}</div>`;

    if (dayRows.length === 0) {
      block.innerHTML += `<div class="no-activities">Nothing scheduled</div>`;
    } else {
      const table = document.createElement("table");
      table.className = "day-table";
      table.innerHTML = `<thead><tr><th>Time</th><th>Duration</th><th>Activity / Event</th><th>Venue</th><th>Contact</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector("tbody");
      dayRows.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${esc(fmtTime(r.time))}</td><td>${esc(r.duration)}</td><td>${esc(r.activity)}</td><td>${esc(r.venue)}</td><td>${esc(r.contact)}</td>`;
        tbody.appendChild(tr);
      });
      block.appendChild(table);
    }
    body.appendChild(block);
  });
}

// ── Month mode: boxed calendar grid ──
function renderMonthGrid() {
  const body = document.getElementById("sheet-body");
  body.innerHTML = "";
  const todayStr = toDateStr(new Date());

  const y = anchor.getFullYear(), m = anchor.getMonth();
  const first = new Date(y, m, 1);
  const title = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  document.getElementById("range-label").textContent = title;
  document.getElementById("sheet-title").textContent = title;

  const gridStart = startOfWeek(first);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const last = new Date(y, m, daysInMonth);
  const gridEnd = new Date(last);
  gridEnd.setDate(gridEnd.getDate() + (6 - last.getDay()));

  let cur = new Date(gridStart);
  while (cur <= gridEnd) {
    const row = document.createElement("div");
    row.className = "week-row";
    for (let i = 0; i < 7; i++) {
      const inMonth = cur.getMonth() === m;
      row.appendChild(buildCell(new Date(cur), todayStr, 3, !inMonth));
      cur.setDate(cur.getDate() + 1);
    }
    body.appendChild(row);
  }
}

function buildCell(d, todayStr, maxLines, blank) {
  const dateStr = toDateStr(d);
  const cell = document.createElement("div");
  const isWeekend = d.getDay() === 0 || d.getDay() === 6;

  if (blank) {
    cell.className = "cal-cell empty";
    return cell;
  }

  cell.className = "cal-cell" + (isWeekend ? " weekend" : "") + (dateStr === todayStr ? " today" : "");
  const rows = (rowsByDate[dateStr] || []).slice();
  const effectiveMax = printing ? rows.length : maxLines;
  const shown = rows.slice(0, effectiveMax);
  const extra = rows.length - shown.length;

  let html = `<div class="daynum">${d.getDate()}</div>`;
  shown.forEach(r => {
    const timePart = r.time ? esc(fmtTime(r.time)) + " " : "";
    const venuePart = (mode === "week" && r.venue) ? ` <span class="venue">— ${esc(r.venue)}</span>` : "";
    html += `<div class="entry">${timePart}${esc(r.activity)}${venuePart}</div>`;
  });
  if (extra > 0) html += `<div class="more">+${extra} more</div>`;
  cell.innerHTML = html;

  if (rows.length > 0) {
    cell.onclick = () => openModal(d, rows);
  }
  return cell;
}

function openModal(d, rows) {
  document.getElementById("modal-title").textContent =
    d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const body = document.getElementById("modal-body");
  body.innerHTML = rows.map(r => `
    <div class="modal-entry">
      <div class="m-activity">${esc(r.activity)}</div>
      <div class="m-meta">${[fmtTime(r.time), r.duration].filter(Boolean).join(" · ")}</div>
      <div class="m-meta">${[r.venue, r.contact].filter(Boolean).join(" · ")}</div>
    </div>`).join("");
  document.getElementById("modal-overlay").classList.add("open");
}
function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById("modal-overlay").classList.remove("open");
}

function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// This page always shows times in lowercase am/pm, regardless of how the
// underlying Sheet/API text is cased (the admin page keeps its own casing).
function fmtTime(t) { return String(t || "").replace(/AM/gi, "am").replace(/PM/gi, "pm"); }

loadAndRender();
</script>
</body>
</html>
