<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issues Progress Tracker – Bridgeman Downs Residents Hub</title>
<style>
  :root {
    --green-bg: #d4edda; --green-text: #155724; --green-border: #28a745;
    --blue-bg:  #E7F1FB; --blue-text:  #1F4E79; --blue-border:  #1F4E79;
    --amber-bg: #fff3cd; --amber-text: #7a5200; --amber-border: #e0a800;
    --gray-bg:  #f0f0f0; --gray-text:  #3a3a3a; --gray-border:  #888;
    --border:   #c5d8ee;
    --surface:  #E7F1FB;
    --page-bg:  #ffffff;
    --text:     #1a1a1a;
    --text-muted: #5f6368;
    --hub-blue: #1F4E79;
    --radius:   6px;
    --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--page-bg);
    color: var(--text);
    font-size: 20px;
    line-height: 1.6;
  }

  /* ── Header ── */
  .page-header {
    background: #1F4E79;
    color: #fff;
    padding: 1.25rem 1.5rem;
  }
  .page-header h1 {
    font-size: 2em;
    font-weight: 700;
    margin-bottom: 0.15rem;
  }
  .page-header p {
    font-size: 0.95em;
    opacity: 0.88;
  }

  /* ── Summary bar ── */
  .summary-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0.75rem 1.5rem;
    background: #f8fbff;
    border-bottom: 1px solid var(--border);
  }
  .stat-chip {
    font-size: 0.78em;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid transparent;
  }

  /* ── Filter row ── */
  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0.65rem 1.5rem;
    border-bottom: 1px solid var(--border);
    align-items: center;
    background: #f8fbff;
  }
  .filter-row span {
    font-size: 0.85em;
    color: var(--text-muted);
    margin-right: 2px;
  }
  .filter-btn {
    font-size: 0.82em;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--page-bg);
    color: var(--hub-blue);
    cursor: pointer;
    font-family: var(--font);
    font-weight: 600;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .filter-btn.active {
    background: var(--hub-blue);
    color: #fff;
    border-color: var(--hub-blue);
  }
  .filter-btn:hover:not(.active) {
    background: var(--surface);
    color: var(--hub-blue);
    border-color: var(--hub-blue);
  }

  /* ── Last updated notice ── */
  .last-updated {
    font-size: 0.78em;
    color: var(--text-muted);
    padding: 0.35rem 1.5rem;
    background: #f8fbff;
    border-bottom: 1px solid var(--border);
  }

  /* ── Main content ── */
  .main { padding: 1rem 1.5rem 2rem; max-width: 900px; margin: 0 auto; }

  /* ── Category blocks ── */
  .cat-block {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    cursor: pointer;
    background: var(--surface);
    gap: 10px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-header:hover { background: #cfe0f5; }

  .cat-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    flex-wrap: wrap;
  }
  .cat-name {
    font-weight: 700;
    font-size: 1.05em;
    color: var(--hub-blue);
  }
  .cat-mini-pills { display: flex; gap: 5px; flex-wrap: wrap; }
  .mini-pill {
    font-size: 0.72em;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid transparent;
  }

  .cat-chevron {
    font-size: 1.1em;
    color: var(--hub-blue);
    font-weight: 700;
    transition: transform 0.25s ease;
    flex-shrink: 0;
    line-height: 1;
  }
  .cat-block.open .cat-chevron { transform: rotate(180deg); }

  .cat-body {
    display: none;
    border-top: 1px solid var(--border);
  }
  .cat-block.open .cat-body { display: block; }

  /* ── Issue rows ── */
  .issue-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 10px 16px;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    background: var(--page-bg);
  }
  .issue-row:last-child { border-bottom: none; }
  .issue-row.hidden { display: none; }

  .issue-text { flex: 1; min-width: 0; }
  .issue-name { font-size: 0.92em; font-weight: 600; color: var(--hub-blue); line-height: 1.4; }
  .issue-note { font-size: 0.82em; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }

  .badge {
    font-size: 0.75em;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
    border: 1px solid transparent;
  }

  /* ── Status colours — stronger contrast ── */
  .s-completed  { background: var(--green-bg); color: var(--green-text); border-color: var(--green-border); }
  .s-inprogress { background: var(--blue-bg);  color: var(--blue-text);  border-color: var(--blue-border); }
  .s-onhold     { background: var(--amber-bg); color: var(--amber-text); border-color: var(--amber-border); }
  .s-notstarted { background: var(--gray-bg);  color: var(--gray-text);  border-color: var(--gray-border); }

  .manor-badge {
    font-size: 0.72em;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    background: #f0e8ff;
    color: #5b2d8e;
    border: 1px solid #9b59b6;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }

  /* ── Loading / error states ── */
  .state-msg {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--text-muted);
    font-size: 0.92em;
  }
  .state-msg .icon { font-size: 2rem; margin-bottom: 0.5rem; }

  /* ── No results ── */
  .no-results {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--text-muted);
    font-size: 0.92em;
    display: none;
  }

  /* ── Expand/collapse all ── */
  .expand-row {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-bottom: 0.75rem;
  }
  .expand-btn {
    font-size: 0.82em;
    color: var(--hub-blue);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    font-weight: 600;
    padding: 2px 0;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .expand-btn:hover { color: #163d60; }

  @media(max-width:600px){
    .page-header h1 { font-size: 1.5em; }
    .main { padding: 0.75rem 1rem 2rem; }
    .cat-header { padding: 11px 12px; }
    .issue-row { padding: 9px 12px; flex-direction: column; gap: 6px; }
    .badge { align-self: flex-start; }
  }
</style>
</head>
<body>


<!-- Back to Hub bar -->
<div style="background:#E7F1FB;border-bottom:2px solid #c5d8ee;padding:8px 16px;">
  <a href="index.html" style="color:#1F4E79;font-weight:700;font-size:0.88em;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:white;border:1px solid #c5d8ee;border-radius:6px;padding:5px 14px;transition:all 0.15s;">
    ◀ Back to Residents Hub
  </a>
</div>
<div class="page-header">
  <h1>Issues Progress Tracker</h1>
  <p>Bridgeman Downs Retirement Village — Residents Committee</p>
</div>

<div class="summary-bar" id="summary-bar">
  <span class="stat-chip" style="background:#E7F1FB;color:#1F4E79;border-color:#c5d8ee;">Loading…</span>
</div>

<div class="filter-row">
  <span>Filter by status:</span>
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="Completed">Completed</button>
  <button class="filter-btn" data-filter="In Progress">In progress</button>
  <button class="filter-btn" data-filter="Not Started">Not started</button>
  <button class="filter-btn" data-filter="On Hold">On hold</button>
  <span style="margin-left:20px;color:#555;">Search:</span>
  <input type="text" id="issueSearch" placeholder="Type to search issues…"
    oninput="applySearch()"
    style="padding:5px 10px;border:1px solid #ccc;border-radius:4px;font-size:0.9em;width:220px;margin-left:6px;">
  <button onclick="document.getElementById('issueSearch').value='';applySearch();"
    title="Clear search"
    style="margin-left:4px;padding:5px 10px;border:1px solid #ccc;border-radius:4px;cursor:pointer;background:#f5f5f5;color:#555;">&#10005;</button>
</div>

<div class="last-updated" id="last-updated">Loading data…</div>

<div class="main">
  <div id="loading" class="state-msg">
    <div class="icon">⏳</div>
    <div>Loading tracker data…</div>
  </div>
  <div id="error" class="state-msg" style="display:none">
    <div class="icon">⚠️</div>
    <div id="error-msg">Unable to load data. Please try refreshing the page.</div>
  </div>
  <div id="content" style="display:none">
    <div class="expand-row">
      <button class="expand-btn" id="expand-all">Expand all ▼</button>
      <button class="expand-btn" id="collapse-all">Collapse all ▲</button>
    </div>
    <div id="accordion"></div>
    <div class="no-results" id="no-results">No issues match this filter.</div>
  </div>
</div>

<script>
// ── CONFIGURATION ─────────────────────────────────────────────────────────────
// Replace this URL with your published Google Sheet CSV link
// Sheet columns (in order): Category | Topic | CM Notes | Status
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTB9ycPfMGB70frGHsduYXmDyTG4ajvoyePSN9ACK_0NgXBH-8qiJFges9RoEGEir8pKRskQD5RIlLw/pub?gid=257098805&single=true&output=csv";

// How often to refresh data (milliseconds). 300000 = 5 minutes.
const REFRESH_INTERVAL = 300000;
// ─────────────────────────────────────────────────────────────────────────────

let allData = [];
let activeFilter = "all";

function statusClass(s) {
  if (s === "Completed")   return "s-completed";
  if (s === "In Progress") return "s-inprogress";
  if (s === "On Hold")     return "s-onhold";
  return "s-notstarted";
}
function statusLabel(s) {
  if (s === "Completed")   return "Completed";
  if (s === "In Progress") return "In progress";
  if (s === "On Hold")     return "On hold";
  return "Not started";
}

function parseCSV(text) {
  const lines = text.trim().replace(/\r/g, "").split("\n");
  if (lines.length < 2) return [];
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = [];
    let cur = "", inQ = false;
    for (let c = 0; c < lines[i].length; c++) {
      const ch = lines[i][c];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ""; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    const [category, topic, cmNotes, status, source] = cols;
    if (category && topic && status) {
      rows.push({ category: category.trim(), topic: topic.trim(), notes: (cmNotes || "").trim(), status: status.trim(), source: (source || "General").trim() });
    }
  }
  return rows;
}

function groupByCategory(rows) {
  const map = {};
  rows.forEach(r => {
    if (!map[r.category]) map[r.category] = [];
    map[r.category].push(r);
  });
  return map;
}

function buildSummary(rows) {
  const counts = { Completed: 0, "In Progress": 0, "Not Started": 0, "On Hold": 0 };
  rows.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
  const total = rows.length;
  const bar = document.getElementById("summary-bar");
  bar.innerHTML = [
    { label: total + " total",                       bg: "#E7F1FB", col: "#1F4E79", bc: "#c5d8ee" },
    { label: counts["Completed"] + " completed",     bg: "#d4edda", col: "#155724", bc: "#28a745" },
    { label: counts["In Progress"] + " in progress", bg: "#E7F1FB", col: "#1F4E79", bc: "#1F4E79" },
    { label: counts["Not Started"] + " not started", bg: "#f0f0f0", col: "#3a3a3a", bc: "#888"    },
    { label: counts["On Hold"] + " on hold",         bg: "#fff3cd", col: "#7a5200", bc: "#e0a800" },
  ].map(s =>
    `<span class="stat-chip" style="background:${s.bg};color:${s.col};border-color:${s.bc};">${s.label}</span>`
  ).join("");
}

function buildAccordion(grouped) {
  const acc = document.getElementById("accordion");
  acc.innerHTML = "";

  Object.entries(grouped).forEach(([catName, issues]) => {
    const catCounts = {};
    issues.forEach(i => { catCounts[i.status] = (catCounts[i.status] || 0) + 1; });

    const miniPills = Object.entries(catCounts).map(([s, n]) =>
      `<span class="mini-pill ${statusClass(s)}" data-status="${s}">${n} ${statusLabel(s)}</span>`
    ).join("");

    const rows = issues.map(i =>
      `<div class="issue-row" data-status="${i.status}">
        <div class="issue-text">
          <div class="issue-name">${escHtml(i.topic)}${i.source === "Manor" ? ' <span class="manor-badge">🏡 Manor</span>' : ""}</div>
          ${i.notes ? `<div class="issue-note">${escHtml(i.notes)}</div>` : ""}
        </div>
        <span class="badge ${statusClass(i.status)}">${statusLabel(i.status)}</span>
      </div>`
    ).join("");

    const block = document.createElement("div");
    block.className = "cat-block";
    block.dataset.cat = catName;
    block.innerHTML = `
      <div class="cat-header">
        <div class="cat-left">
          <span class="cat-name">${escHtml(catName)}</span>
          <div class="cat-mini-pills">${miniPills}</div>
        </div>
        <span class="cat-chevron">▼</span>
      </div>
      <div class="cat-body">${rows}</div>`;

    block.querySelector(".cat-header").addEventListener("click", () => block.classList.toggle("open"));
    acc.appendChild(block);
  });
}

function applySearch() {
  var term = document.getElementById('issueSearch').value.toLowerCase().trim();
  var hasSearch = term.length > 0;
  document.querySelectorAll('.cat-block').forEach(function(block) {
    var catHasVisible = false;
    block.querySelectorAll('.issue-row').forEach(function(row) {
      if (hasSearch) {
        var text = row.textContent.toLowerCase();
        var show = text.includes(term);
        row.classList.toggle('hidden', !show);
        if (show) catHasVisible = true;
      } else {
        row.classList.remove('hidden');
        var activeFilter = document.querySelector('.filter-btn.active');
        var filter = activeFilter ? activeFilter.dataset.filter : 'all';
        if (filter !== 'all' && row.dataset.status !== filter) {
          row.classList.add('hidden');
        } else {
          catHasVisible = true;
        }
      }
    });
    block.style.display = (catHasVisible || !hasSearch) ? '' : 'none';
  });
  var anyVisible = document.querySelectorAll('.issue-row:not(.hidden)').length > 0;
  document.getElementById('no-results').style.display = anyVisible ? 'none' : 'block';
}

function applyFilter(filter) {
  activeFilter = filter;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === filter));

  let anyVisible = false;
  document.querySelectorAll(".cat-block").forEach(block => {
    let catHasVisible = false;
    block.querySelectorAll(".issue-row").forEach(row => {
      const show = filter === "all" || row.dataset.status === filter;
      row.classList.toggle("hidden", !show);
      if (show) catHasVisible = true;
    });
    block.style.display = catHasVisible ? "" : "none";
    if (catHasVisible) anyVisible = true;

    // Show only mini pills that match the active filter
    block.querySelectorAll(".mini-pill").forEach(pill => {
      if (filter === "all") {
        pill.style.display = "";
      } else {
        const pillStatus = pill.dataset.status;
        pill.style.display = (pillStatus === filter) ? "" : "none";
      }
    });
  });

  document.getElementById("no-results").style.display = anyVisible ? "none" : "block";
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function loadData() {
  try {
    const resp = await fetch(SHEET_CSV_URL + "&cachebust=" + Date.now());
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const text = await resp.text();
    allData = parseCSV(text);
    if (!allData.length) throw new Error("No data rows found");

    const grouped = groupByCategory(allData);
    buildSummary(allData);
    buildAccordion(grouped);
    applyFilter(activeFilter);

    document.getElementById("last-updated").textContent =
      "Last refreshed: " + new Date().toLocaleString("en-AU", { dateStyle: "medium", timeStyle: "short" });

    document.getElementById("loading").style.display = "none";
    document.getElementById("error").style.display   = "none";
    document.getElementById("content").style.display = "block";

  } catch (err) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("error-msg").textContent = "Unable to load data. Please try refreshing the page. (" + err.message + ")";
    document.getElementById("error").style.display = "block";
  }
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => applyFilter(btn.dataset.filter));
});

document.getElementById("expand-all").addEventListener("click", () => {
  document.querySelectorAll(".cat-block").forEach(b => { if (b.style.display !== "none") b.classList.add("open"); });
});
document.getElementById("collapse-all").addEventListener("click", () => {
  document.querySelectorAll(".cat-block").forEach(b => b.classList.remove("open"));
});

loadData();
setInterval(loadData, REFRESH_INTERVAL);
</script>
</body>
</html>
