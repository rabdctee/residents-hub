<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chair — Resident Submissions</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
    color: #222;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px 20px; }
  h1 { color: #1b3a5c; }
  #pinScreen {
    max-width: 400px;
    margin: 80px auto;
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.15);
    text-align: center;
  }
  #pinScreen input {
    font-size: 20px;
    padding: 10px;
    width: 140px;
    text-align: center;
    margin-top: 12px;
  }
  #pinScreen button {
    display: block;
    margin: 16px auto 0 auto;
    padding: 10px 24px;
    font-size: 16px;
    background: #1b6fb8;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #app { display: none; }
  .filters { margin: 16px 0; }
  .filters button {
    padding: 8px 14px;
    margin-right: 8px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 1px solid #1b6fb8;
    background: #fff;
    color: #1b6fb8;
    cursor: pointer;
  }
  .filters button.active {
    background: #1b6fb8;
    color: #fff;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    border-left: 6px solid #1b6fb8;
  }
  .card.status-New { border-left-color: #b3261e; }
  .card.status-Under-Review { border-left-color: #b8860b; }
  .card.status-Responded { border-left-color: #1b6fb8; }
  .card.status-Listed-for-RC-Meeting { border-left-color: #6a1bb8; }
  .card.status-Resolved { border-left-color: #2f9e52; }
  .meta { font-size: 14px; color: #555; margin-bottom: 8px; }
  .desc { font-size: 16px; margin: 10px 0; white-space: pre-wrap; }
  label { display: block; font-size: 14px; font-weight: bold; margin-top: 10px; }
  select, textarea, input[type=text] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    font-size: 15px;
    border: 1px solid #bbb;
    border-radius: 6px;
    margin-top: 4px;
  }
  textarea { min-height: 70px; }
  .save-btn {
    margin-top: 12px;
    padding: 8px 18px;
    background: #2f9e52;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .saved-msg { color: #2f9e52; font-size: 14px; margin-left: 10px; }

  /* ── Reply helper ── */
  .reply-box {
    background: #eef4fb;
    border: 1px solid #c9dcef;
    border-radius: 8px;
    padding: 12px;
    margin-top: 12px;
  }
  .reply-box .reply-title { font-weight: bold; font-size: 14px; color: #1b3a5c; margin-bottom: 8px; }
  .reply-box .reply-hint { font-size: 13px; color: #555; margin-bottom: 8px; }
  .reply-btn {
    display: inline-block;
    padding: 8px 14px;
    margin: 0 8px 8px 0;
    border-radius: 6px;
    background: #1b6fb8;
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    border: none;
    cursor: pointer;
  }
  .reply-btn.light { background: #fff; color: #1b6fb8; border: 1px solid #1b6fb8; }
  .replied-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
  .replied-row select { width: auto; margin-top: 0; }
</style>
</head>
<body>

<div class="wrap" id="app">
  <h1>Resident Submissions</h1>
  <p>Only you can see this page. Update status and add notes as items are actioned.</p>

  <div class="filters" id="filters"></div>
  <div id="list">Loading...</div>
</div>

<script src="hub-pin.js"></script>
<script>
  // ============ SETUP: fill these in ============
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzaoV8H-1vFSQvTdaxdKs00_YcacN3GN6sL-7kOB6R_7ilCq0LVsOj7aUV-35qXrYzv/exec";   // the Resident Submissions web app (same as in raise-a-concern.html)
  const CHAIR_SECRET_KEY = "C0ncerns"; // Must match the Apps Script exactly
  // ================================================

  const STATUS_OPTIONS = ["New", "Under Review", "Responded", "Listed for RC Meeting", "Resolved"];
  let allRows = [];
  let activeFilter = "All";

  function loadData() {
    fetch(`${APPS_SCRIPT_URL}?key=${encodeURIComponent(CHAIR_SECRET_KEY)}&token=${encodeURIComponent(HubPin.token())}`)
      .then(r => r.json())
      .then(rows => {
        if (rows && rows.signIn) { HubPin.expired(); return; }   // sign-in has run out
        // rows[0] is the header row; each following row is a submission
        allRows = rows.slice(1).map((r, i) => ({
          rowNum: i + 2, // actual sheet row number (header is row 1)
          timestamp: r[0],
          name: r[1],
          unit: r[2],
          contact: r[3],
          category: r[4],
          description: r[5],
          status: r[6] || "New",
          notes: r[7] || "",
          discussed: r[8] || "",
          linked: r[9] || ""
        })).reverse(); // newest first
        buildFilters();
        render();
      })
      .catch(() => {
        document.getElementById('list').textContent = "Could not load submissions. Check the Apps Script URL and secret key.";
      });
  }

  function buildFilters() {
    const el = document.getElementById('filters');
    el.innerHTML = "";
    ["All", ...STATUS_OPTIONS].forEach(s => {
      const btn = document.createElement('button');
      btn.textContent = s;
      if (s === activeFilter) btn.classList.add('active');
      btn.onclick = () => { activeFilter = s; buildFilters(); render(); };
      el.appendChild(btn);
    });
  }

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = "";
    const rows = activeFilter === "All" ? allRows : allRows.filter(r => r.status === activeFilter);
    if (rows.length === 0) {
      list.textContent = "No submissions in this category.";
      return;
    }
    rows.forEach(r => {
      const card = document.createElement('div');
      card.className = `card status-${r.status.replace(/\s+/g,'-')}`;
      card.innerHTML = `
        <div class="meta">${friendlyDate(r.timestamp)} — ${r.category}</div>
        <strong>${r.name}</strong> ${r.unit ? "(" + r.unit + ")" : ""}
        ${r.contact ? "<br>Contact: " + r.contact : ""}
        <div class="desc">${r.description}</div>

        <div class="reply-box">
          <div class="reply-title">Reply to ${r.name || "this resident"}</div>
          <div class="reply-actions"></div>
          <div class="replied-row">
            <span style="font-size:14px;">Once you've replied:</span>
            <select class="replyHow">
              <option>by email</option>
              <option>by SMS</option>
              <option>by phone</option>
              <option>by letterbox note</option>
              <option>in person</option>
            </select>
            <button type="button" class="reply-btn light markReplied">✅ Mark as replied</button>
          </div>
        </div>

        <label>Status</label>
        <select data-row="${r.rowNum}" class="statusSel">
          ${STATUS_OPTIONS.map(s => `<option ${s===r.status?"selected":""}>${s}</option>`).join("")}
        </select>

        <label>Chair Notes / Response</label>
        <textarea data-row="${r.rowNum}" class="notesTxt">${r.notes}</textarea>

        <label>Date Discussed at RC Meeting</label>
        <input type="text" data-row="${r.rowNum}" class="discussedTxt" value="${r.discussed}" placeholder="e.g. 12 Aug 2026">

        <label>Linked Issue Tracker Reference (if escalated)</label>
        <input type="text" data-row="${r.rowNum}" class="linkedTxt" value="${r.linked}" placeholder="e.g. Issue #24">

        <button class="save-btn" data-row="${r.rowNum}">Save</button>
        <span class="saved-msg" id="saved-${r.rowNum}"></span>
      `;
      list.appendChild(card);

      card.querySelector('.save-btn').addEventListener('click', () => saveRow(r.rowNum, card));
      // Once something is changed again, the old "Saved" message no longer applies
      card.querySelectorAll('.statusSel, .notesTxt, .discussedTxt, .linkedTxt').forEach(el =>
        el.addEventListener('input', () => {
          if (!card.querySelector('.save-btn').disabled) {
            const m = document.getElementById(`saved-${r.rowNum}`);
            m.style.color = "#b8860b";
            m.textContent = "Changes not saved yet";
          }
        }));
      buildReplyHelper(r, card);
    });
  }

  // ── REPLY HELPER ──────────────────────────────────────────────
  // Works out whether the resident left an email address and/or a phone
  // number, and offers the right buttons. Replies are sent from your own
  // Gmail, so they sit in your Sent folder and the resident can answer you.
  function friendlyDate(ts) {
    const d = new Date(ts);
    if (isNaN(d)) return String(ts || "");
    return d.toLocaleDateString("en-AU", { day: "numeric", month: "long", year: "numeric" });
  }

  function buildReplyHelper(r, card) {
    const box     = card.querySelector('.reply-actions');
    const contact = String(r.contact || "");
    const email   = (contact.match(/[^\s@,;<>()]+@[^\s@,;<>()]+\.[^\s@,;<>()]+/) || [""])[0];
    const phoneRaw = (contact.replace(email, "").match(/\+?[\d\s()-]{8,}/) || [""])[0].trim();
    const phone   = phoneRaw.replace(/[^\d+]/g, "");
    const raised  = friendlyDate(r.timestamp);
    const first   = String(r.name || "").trim().split(/\s+/)[0] || "";

    if (email) {
      const subject = "Your concern raised on " + raised;
      const body =
        "Dear " + (first || "Resident") + ",\n\n" +
        "Thank you for raising your concern with the Residents Committee.\n\n\n\n" +
        "Kind regards,\nRick Van Haeften\nChair, BDRV Residents Committee\n\n" +
        "----- Your original message (" + raised + ") -----\n" +
        "Category: " + (r.category || "") + "\n" +
        String(r.description || "");
      const link = document.createElement('a');
      link.className = 'reply-btn';
      link.target = '_blank';
      link.textContent = '✉️ Reply by email';
      link.href = 'https://mail.google.com/mail/?view=cm&fs=1' +
                  '&to=' + encodeURIComponent(email) +
                  '&su=' + encodeURIComponent(subject) +
                  '&body=' + encodeURIComponent(body);
      box.appendChild(link);
    }

    const hasPhone = phone.replace(/\D/g, "").length >= 8;
    if (hasPhone) {
      const call = document.createElement('a');
      call.className = 'reply-btn' + (email ? ' light' : '');
      call.href = 'tel:' + phone;
      call.textContent = '📞 Ring ' + phoneRaw;
      box.appendChild(call);
    }

    if (!email && !hasPhone) {
      const hint = document.createElement('div');
      hint.className = 'reply-hint';
      hint.textContent = 'No email or phone number was left — a note in the letterbox of unit ' +
                         (r.unit || '?') + ' will reach them.';
      box.appendChild(hint);
      card.querySelector('.replyHow').value = 'by letterbox note';
    } else if (!email) {
      card.querySelector('.replyHow').value = 'by phone';
    }

    // "Mark as replied": adds a dated line to the notes, sets the status to
    // Responded and saves — all in one press.
    card.querySelector('.markReplied').addEventListener('click', () => {
      const how   = card.querySelector('.replyHow').value;
      const today = new Date().toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
      const notes = card.querySelector('.notesTxt');
      notes.value = (notes.value.trim() ? notes.value.trim() + "\n" : "") + "Replied " + how + ", " + today + ".";
      card.querySelector('.statusSel').value = "Responded";
      saveRow(r.rowNum, card);
    });
  }

  function saveRow(rowNum, card) {
    const status = card.querySelector('.statusSel').value;
    const notes = card.querySelector('.notesTxt').value;
    const discussed = card.querySelector('.discussedTxt').value;
    const linked = card.querySelector('.linkedTxt').value;

    const data = new FormData();
    data.append('action', 'updateSubmission');
    data.append('key', CHAIR_SECRET_KEY);
    data.append('token', HubPin.token());
    data.append('row', rowNum);
    data.append('status', status);
    data.append('notes', notes);
    data.append('discussed', discussed);
    data.append('linked', linked);

    // Show straight away that something is happening — Google can take a few
    // seconds to answer — and stop a second press while it's saving.
    const btn = card.querySelector('.save-btn');
    const msg = document.getElementById(`saved-${rowNum}`);
    btn.disabled = true;
    btn.textContent = "Saving…";
    msg.style.color = "#555";
    msg.textContent = "Please wait…";

    fetch(APPS_SCRIPT_URL, { method: 'POST', body: data })
      .then(r => r.json())
      .then(reply => {
        if (reply.signIn) { HubPin.expired(); return; }   // sign-in has run out
        if (reply.result !== 'ok') throw new Error('not saved');
        const time = new Date().toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" });
        msg.style.color = "#2f9e52";
        msg.textContent = "Saved ✓ at " + time;   // stays on screen, so it can't be missed
      })
      .catch(() => {
        msg.style.color = "#b3261e";
        msg.textContent = "⚠️ Not saved — please press Save again.";
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = "Save";
      });
  }

  // ── Sign in with a personal PIN (hub-pin.js), then load the page ──
  // The old shared PIN still works until legacyUntil, with a reminder to set up a personal PIN.
  HubPin.require({
    area: ["rc-chair", "admin"],
    title: "🔒 Resident Submissions",
    subtitle: "Chair access only.",
    legacyPin: "1957",
    legacyUntil: "2026-11-30"
  }, function () {
    document.getElementById('app').style.display = 'block';
    loadData();
  });
</script>

</body>
</html>
