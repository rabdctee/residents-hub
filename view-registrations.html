<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registrations | Bridgeman Downs Residents Hub</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#f5f5f5; display:flex; flex-direction:column; height:100vh; }

    .top-bar {
      background:#1F4E79;
      padding:12px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:10px;
      flex-shrink:0;
    }
    .top-bar-info { min-width:0; }
    .top-bar-title { color:white; font-size:1em; font-weight:700; }
    .top-bar-sub { color:rgba(255,255,255,0.72); font-size:0.8em; margin-top:2px; }

    .btn-group { display:flex; gap:8px; flex-shrink:0; }

    .back-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:white; color:#1F4E79;
      padding:9px 16px; border-radius:7px;
      text-decoration:none; font-weight:700; font-size:0.88em;
      border:2px solid white; white-space:nowrap; transition:background 0.2s;
    }
    .back-btn:hover { background:#E7F1FB; }

    .print-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(255,255,255,0.15); color:white;
      padding:9px 16px; border-radius:7px;
      font-weight:700; font-size:0.88em; cursor:pointer;
      border:2px solid rgba(255,255,255,0.4); white-space:nowrap;
      transition:background 0.2s;
    }
    .print-btn:hover { background:rgba(255,255,255,0.25); }

    .info-bar {
      background:#E7F1FB;
      border-bottom:2px solid #c5d8ee;
      padding:8px 20px;
      font-size:0.83em;
      color:#1F4E79;
      flex-shrink:0;
    }

    .sheet-frame {
      flex:1; width:100%; border:none; display:block;
      background:white; min-height:0;
    }

    @media(max-width:600px){
      .top-bar { padding:10px 14px; }
      .back-btn, .print-btn { font-size:0.8em; padding:8px 12px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-info">
      <div class="top-bar-title">👥 Event Registrations</div>
      <div class="top-bar-sub">Social Club — read only</div>
    </div>
    <div class="btn-group">
      <button class="print-btn" onclick="window.print()">🖨️ Print</button>
      <a class="back-btn" href="index.html?expand=sc-events#committee">← Back</a>
    </div>
  </div>

  <div class="info-bar">
    💡 This is a read-only view of event registrations. Use the <strong>Print</strong> button to print a list for an event, or <strong>Back</strong> to return to the Committee page.
  </div>

  <iframe
    class="sheet-frame"
    src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRUhPoqJON4Uj1yF9VTORD4RSrLJzMjoNOT9ObAAqMze2TfwKTHwRHKSp_q8wN7tNo26o49d3TbgjnB/pubhtml?gid=41043603&single=true"
    title="Event Registrations">
  </iframe>

</body>
</html>
