<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registrations | Bridgeman Downs Residents Hub</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#f5f5f5; display:flex; flex-direction:column; min-height:100vh; }

    /* ── Top bar ── */
    .top-bar {
      background:#1F4E79; padding:12px 20px;
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:10px; flex-shrink:0;
    }
    .top-bar-title { color:white; font-size:1em; font-weight:700; }
    .top-bar-sub   { color:rgba(255,255,255,0.72); font-size:0.8em; margin-top:2px; }
    .btn-group { display:flex; gap:8px; flex-shrink:0; }
    .back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #1F4E79; color: #fff; border: none;
  border-radius: 6px; padding: 8px 16px;
  font-size: 0.95rem; font-family: 'Segoe UI', Arial, sans-serif;
  cursor: pointer; text-decoration: none;
}
.back-btn:hover { background: #2E75B6; }
    .print-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(255,255,255,0.15); color:white; padding:9px 16px; border-radius:7px;
      font-weight:700; font-size:0.88em; cursor:pointer;
      border:2px solid rgba(255,255,255,0.4); white-space:nowrap; transition:background 0.2s;
    }
    .print-btn:hover { background:rgba(255,255,255,0.25); }

    /* ── Info bar ── */
    .info-bar {
      background:#E7F1FB; border-bottom:2px solid #c5d8ee;
      padding:8px 20px; font-size:0.83em; color:#1F4E79; flex-shrink:0;
    }

    /* ── Filter bar ── */
    .filter-bar {
      background:#fff; border-bottom:1px solid #ddd;
      padding:10px 20px; display:flex; align-items:center;
      gap:12px; flex-wrap:wrap; flex-shrink:0;
    }
    .filter-bar label { font-size:0.88em; font-weight:600; color:#1F4E79; white-space:nowrap; }
    .filter-bar select {
      padding:7px 12px; border:1.5px solid #b0c8e8; border-radius:6px;
      font-size:0.88em; color:#1F4E79; background:white;
      min-width:220px; cursor:pointer;
    }
    .filter-bar select:focus { outline:none; border-color:#1F4E79; }
    #row-count { font-size:0.82em; color:#555; margin-left:auto; }

    /* ── Tally cards ── */
    .tally-bar {
      background:#f5f5f5; border-bottom:1px solid #ddd;
      padding:14px 20px; display:flex; align-items:center;
      gap:12px; flex-wrap:wrap; flex-shrink:0;
    }
    .tally-card {
      background:white; border:2px solid #e0e0e0; border-radius:10px;
      padding:10px 18px; min-width:90px; text-align:center;
      box-shadow:0 1px 4px rgba(0,0,0,0.06);
      cursor:pointer; user-select:none; transition:box-shadow 0.15s, transform 0.1s;
    }
    .tally-card:hover { box-shadow:0 3px 10px rgba(0,0,0,0.13); transform:translateY(-1px); }
    .tally-card.active { box-shadow:0 0 0 3px #1F4E79; }
    .tally-card .tally-num  { font-size:1.6em; font-weight:800; line-height:1.1; }
    .tally-card .tally-lbl  { font-size:0.72em; color:#666; margin-top:2px; }
    .tally-total   .tally-num { color:#1F4E79; }
    .tally-paid    .tally-num { color:#15803d; }
    .tally-unpaid  .tally-num { color:#c0392b; }
    .tally-dietary .tally-num { color:#b45309; }

    /* ── Print filter heading ── */
    .print-filter-heading { display:none; }
    /* ── Accordion ── */
    .accordion-wrap {
      border: 1.5px solid #dde3ec;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 20px 24px;
    }
    .accordion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: #f0f4fa;
      cursor: pointer;
      user-select: none;
      border-bottom: 1.5px solid #dde3ec;
    }
    .accordion-header:hover { background: #e4eaf6; }
    .accordion-title {
      font-weight: 700;
      font-size: 0.92em;
      color: var(--navy);
    }
    .accordion-toggle {
      font-size: 1.1em;
      color: var(--navy);
      transition: transform 0.2s;
      line-height: 1;
    }
    .accordion-toggle.collapsed { transform: rotate(-90deg); }
    .accordion-body {
      overflow: hidden;
      transition: max-height 0.25s ease;
    }
    .accordion-body.collapsed { max-height: 0 !important; }
    .table-wrap {
      flex: 1;
      overflow: auto;
      padding: 16px 20px 24px;
      margin: 0;
      border-radius: 0;
      border: none;
    }

    @media print {
      .print-filter-heading { display:block; font-size:1.1em; font-weight:700; margin-bottom:10px; color:#000; }
    }

    /* ── Table wrapper ── */
    .table-wrap { flex:1; overflow:auto; padding:16px 20px 24px; }

    table { border-collapse:collapse; width:100%; background:white; font-size:0.84em; }
    thead th {
      background:#1F4E79; color:white; padding:9px 12px;
      text-align:left; white-space:nowrap; position:sticky; top:0; z-index:1;
    }
    tbody tr:nth-child(even) { background:#f0f6fd; }
    tbody tr:hover { background:#dbeafe; }
    tbody td { padding:7px 12px; border-bottom:1px solid #e5e5e5; vertical-align:top; }
    .paid-yes { color:#15803d; font-weight:700; }
    .paid-no  { color:#b91c1c; }

    /* ── Status messages ── */
    .status { padding:40px 20px; text-align:center; color:#555; font-size:0.92em; }
    .status.error { color:#b91c1c; }

    /* ── Print styles ── */
    /* ── Accordion ── */
    .accordion-wrap {
      border: 1.5px solid #dde3ec;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 20px 24px;
    }
    .accordion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: #f0f4fa;
      cursor: pointer;
      user-select: none;
      border-bottom: 1.5px solid #dde3ec;
    }
    .accordion-header:hover { background: #e4eaf6; }
    .accordion-title {
      font-weight: 700;
      font-size: 0.92em;
      color: var(--navy);
    }
    .accordion-toggle {
      font-size: 1.1em;
      color: var(--navy);
      transition: transform 0.2s;
      line-height: 1;
    }
    .accordion-toggle.collapsed { transform: rotate(-90deg); }
    .accordion-body {
      overflow: hidden;
      transition: max-height 0.25s ease;
    }
    .accordion-body.collapsed { max-height: 0 !important; }
    .table-wrap {
      flex: 1;
      overflow: auto;
      padding: 16px 20px 24px;
      margin: 0;
      border-radius: 0;
      border: none;
    }

    @media print {
      .top-bar, .info-bar, .filter-bar, .tally-bar { display:none !important; }
      .table-wrap { padding:0; overflow:visible; }
      body { min-height:auto; }
    }

    @media(max-width:600px){
      .top-bar { padding:10px 14px; }
      .back-btn, .print-btn { font-size:0.8em; padding:8px 12px; }
      .table-wrap { padding:10px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-info">
      <div class="top-bar-title">👥 Event Registrations</div>
      <div class="top-bar-sub">Social Club — read only</div>
    </div>
    <div class="btn-group">
      <button class="print-btn" onclick="window.print()">🖨️ Print</button>
      <button onclick="history.back()" class="back-btn">← Back</button>
    </div>
  </div>

  <div class="info-bar">
    💡 This is a read-only view of event registrations. Use the <strong>Print</strong> button to print a list for an event, or <strong>Back</strong> to return to the Committee page.
  </div>

  <div class="filter-bar">
    <label for="event-select">🗓️ Show event:</label>
    <select id="event-select" onchange="applyFilter()">
      <option value="">Loading…</option>
    </select>
    <span id="row-count"></span>
  </div>

  <!-- Tally cards -->
  <div class="tally-bar" id="summary-bar" style="display:none;">
    <div class="tally-card tally-total active" id="card-all" onclick="setTallyFilter('all')" title="Show all registrations">
      <div class="tally-num" id="sum-total">—</div>
      <div class="tally-lbl">all people</div>
    </div>
    <div class="tally-card tally-paid" id="card-paid" onclick="setTallyFilter('paid')" title="Click to show paid only">
      <div class="tally-num" id="sum-paid">—</div>
      <div class="tally-lbl">paid</div>
    </div>
    <div class="tally-card tally-unpaid" id="card-unpaid" onclick="setTallyFilter('unpaid')" title="Click to show unpaid only">
      <div class="tally-num" id="sum-unpaid">—</div>
      <div class="tally-lbl">unpaid</div>
    </div>
    <div class="tally-card tally-dietary" id="sum-dietary-card" style="display:none;" onclick="setTallyFilter('dietary')" title="Click to show dietary requirements only">
      <div class="tally-num" id="sum-dietary">—</div>
      <div class="tally-lbl">dietary req.</div>
    </div>
  </div>

  <div class="accordion-wrap" id="accordion-wrap" style="display:none;">
    <div class="accordion-header" onclick="toggleAccordion()" id="accordion-header">
      <span class="accordion-title" id="accordion-title">Registrations</span>
      <span class="accordion-toggle" id="accordion-toggle">▼</span>
    </div>
    <div class="accordion-body" id="accordion-body">
      <div class="table-wrap" id="table-wrap">
        <div class="print-filter-heading" id="printFilterHeading"></div>
        <div class="status" id="status-msg">Loading registrations…</div>
      </div>
    </div>
  </div>

  <script>
    // ── Published CSV URL (same sheet, gid unchanged) ──────────────────────
    const CSV_URL =
      'https://docs.google.com/spreadsheets/d/e/' +
      '2PACX-1vRUhPoqJON4Uj1yF9VTORD4RSrLJzMjoNOT9ObAAqMze2TfwKTHwRHKSp_q8wN7tNo26o49d3TbgjnB' +
      '/pub?gid=41043603&single=true&output=csv';

    let allRows    = [];   // array of objects, one per data row
    let headers    = [];   // column names from row 1
    let activeFilter = 'all';  // 'all' | 'paid' | 'unpaid' | 'dietary'

    // ── Fetch & parse CSV ─────────────────────────────────────────────────
    async function loadData() {
      try {
        const res = await fetch(CSV_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        parseCSV(text);
        populateDropdown();
        applyFilter();
      } catch (err) {
        document.getElementById('status-msg').textContent =
          '⚠️ Could not load registrations: ' + err.message;
        document.getElementById('status-msg').classList.add('error');
        document.getElementById('status-msg').style.display = 'block';
      }
    }

    // ── Simple but robust CSV parser (handles quoted commas & newlines) ───
    function parseCSV(text) {
      const rows = [];
      let row = [], cell = '', inQuote = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (inQuote) {
          if (ch === '"' && next === '"') { cell += '"'; i++; }
          else if (ch === '"')           { inQuote = false; }
          else                           { cell += ch; }
        } else {
          if      (ch === '"')  { inQuote = true; }
          else if (ch === ',')  { row.push(cell.trim()); cell = ''; }
          else if (ch === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
          else if (ch === '\r') { /* skip */ }
          else                  { cell += ch; }
        }
      }
      if (cell || row.length) { row.push(cell.trim()); rows.push(row); }

      if (rows.length < 2) return;

      // Row 0 = header row from the Google Sheet publish
      // The sheet may prepend a blank row; find the real header row
      // (the one that contains "Name" or "Select Event")
      let headerIdx = 0;
      for (let i = 0; i < Math.min(rows.length, 5); i++) {
        const joined = rows[i].join('|').toLowerCase();
        if (joined.includes('name') || joined.includes('select event') || joined.includes('event')) {
          headerIdx = i; break;
        }
      }
      headers = rows[headerIdx];
      allRows = rows.slice(headerIdx + 1).filter(r => r.some(c => c));
    }

    // ── Find column index by partial name match ───────────────────────────
    function col(name) {
      const n = name.toLowerCase();
      return headers.findIndex(h => h.toLowerCase().includes(n));
    }

    // ── Build event dropdown ──────────────────────────────────────────────
    function populateDropdown() {
      const eventCol = col('event');
      if (eventCol < 0) return;

      // Collect unique event names preserving first-seen order
      const seen = new Map();
      allRows.forEach(r => {
        const ev = (r[eventCol] || '').trim();
        if (ev) seen.set(ev, (seen.get(ev) || 0) + 1);
      });

      // Parse Australian date format dd/mm/yyyy or dd/mm/yyyy HH:mm:ss
      function parseAusDate(str) {
        if (!str) return null;
        // dd/mm/yyyy HH:mm:ss  or  dd/mm/yyyy
        const m = str.match(/^(\d{1,2})[\/](\d{1,2})[\/](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
        if (m) return new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0));
        // Fallback: try native parse (handles ISO etc)
        const d = new Date(str);
        return isNaN(d) ? null : d;
      }

      // Build a map of event -> latest registration date for sorting
      const tsCol2 = col('timestamp');
      const latestTs = new Map();
      allRows.forEach(r => {
        const ev = (r[eventCol] || '').trim();
        if (!ev) return;
        const raw = (tsCol2 >= 0 ? r[tsCol2] : '') || '';
        const d = parseAusDate(raw);
        if (d && !isNaN(d)) {
          if (!latestTs.has(ev) || d > latestTs.get(ev)) latestTs.set(ev, d);
        }
      });

      // Extract date from event name itself e.g. "Morning Tea (21/07/2026)"
      function extractNameDate(name) {
        const m = name.match(/(\d{1,2})[\/](\d{1,2})[\/](\d{4})/);
        if (m) return new Date(+m[3], +m[2]-1, +m[1]);
        return null;
      }

      const allKeys = [...seen.keys()];
      const events = allKeys.slice().sort((a, b) => {
        // Name date takes priority, then latest registration timestamp
        const da = extractNameDate(a) || latestTs.get(a) || new Date(0);
        const db = extractNameDate(b) || latestTs.get(b) || new Date(0);
        return db - da;  // newest first
      });

      const sel = document.getElementById('event-select');
      sel.innerHTML = '';

      events.forEach((ev, i) => {
        const opt = document.createElement('option');
        opt.value = ev;
        opt.textContent = ev;
        sel.appendChild(opt);
      });

      // Add "Show all" at the bottom
      const all = document.createElement('option');
      all.value = '__ALL__';
      all.textContent = '— Show all events —';
      sel.appendChild(all);

      // Default: URL param > most recent event
      const urlEvent = new URLSearchParams(window.location.search).get('event');
      if (urlEvent && events.includes(urlEvent)) {
        sel.value = urlEvent;
      } else {
        sel.value = events[0] || '__ALL__';
      }
    }

    // ── Accordion toggle ──────────────────────────────────────────────────
    function toggleAccordion() {
      const body    = document.getElementById('accordion-body');
      const toggle  = document.getElementById('accordion-toggle');
      const isOpen  = !body.classList.contains('collapsed');
      if (isOpen) {
        body.style.maxHeight = body.scrollHeight + 'px';
        requestAnimationFrame(() => {
          body.classList.add('collapsed');
          toggle.classList.add('collapsed');
        });
      } else {
        body.classList.remove('collapsed');
        toggle.classList.remove('collapsed');
        body.style.maxHeight = body.scrollHeight + 'px';
        setTimeout(() => { body.style.maxHeight = 'none'; }, 260);
      }
    }

    function openAccordion() {
      const body   = document.getElementById('accordion-body');
      const toggle = document.getElementById('accordion-toggle');
      body.classList.remove('collapsed');
      toggle.classList.remove('collapsed');
      body.style.maxHeight = 'none';
    }

    // ── Reset pill filter when event changes ──────────────────────────────
    document.getElementById('event-select').addEventListener('change', function() {
      activeFilter = 'all';
    });

    // ── Tally pill filter ─────────────────────────────────────────────────
    function setTallyFilter(filter) {
      activeFilter = filter;
      // Update active state on cards
      ['all','paid','unpaid'].forEach(function(f) {
        var card = document.getElementById('card-' + f);
        if (card) card.classList.toggle('active', f === filter);
      });
      var dietCard = document.getElementById('sum-dietary-card');
      if (dietCard) dietCard.classList.toggle('active', filter === 'dietary');
      applyFilter();
    }

    // ── Render table for the selected event ──────────────────────────────
    function applyFilter() {
      const sel     = document.getElementById('event-select');
      const chosen  = sel.value;
      const eventCol = col('event');

      const filtered = chosen === '__ALL__'
        ? allRows
        : allRows.filter(r => (r[eventCol] || '').trim() === chosen);

      // Sub-filter by tally pill selection
      const paidColSub  = col('paid');
      const dietColSub  = col('diet');
      let displayRows = filtered;
      if (activeFilter === 'paid') {
        displayRows = filtered.filter(r => {
          const v = (r[paidColSub] || '').trim().toLowerCase();
          return v === 'true' || v === 'yes' || v === '✓';
        });
      } else if (activeFilter === 'unpaid') {
        displayRows = filtered.filter(r => {
          const v = (r[paidColSub] || '').trim().toLowerCase();
          return !(v === 'true' || v === 'yes' || v === '✓');
        });
      } else if (activeFilter === 'dietary') {
        displayRows = filtered.filter(r => (r[dietColSub] || '').trim() !== '');
      }

      const wrap = document.getElementById('table-wrap');
      const statusEl = document.getElementById('status-msg');

      if (filtered.length === 0) {
        wrap.innerHTML = '<div class="status">No registrations found for this event.</div>';
        document.getElementById('row-count').textContent = '';
        document.getElementById('summary-bar').style.display = 'none';
        const aw = document.getElementById('accordion-wrap');
        if (aw) { aw.style.display = ''; openAccordion(); }
        const at = document.getElementById('accordion-title');
        if (at) at.textContent = chosen + ' — 0 registrations';
        return;
      }

      if (displayRows.length === 0) {
        wrap.innerHTML = '<div class="status">No registrations match this filter.</div>';
        document.getElementById('row-count').textContent = '0 registrations (filtered)';
        // Still update tally totals and card highlights before returning
        let tp=0,pp=0,up=0,dc=0;
        const _pc=col('paid'),_nc=col('how many')>=0?col('how many'):col('number'),_dc2=col('diet');
        filtered.forEach(row=>{const n=parseInt(row[_nc]||'1',10)||1,p=(row[_pc]||'').trim().toLowerCase(),d=(row[_dc2]||'').trim(),ok=p==='true'||p==='yes'||p==='✓';tp+=n;if(ok)pp+=n;else up+=n;if(d)dc++;});
        document.getElementById('sum-total').textContent=tp;
        document.getElementById('sum-paid').textContent=pp;
        document.getElementById('sum-unpaid').textContent=up;
        const _dc=document.getElementById('sum-dietary-card');
        if(dc>0){document.getElementById('sum-dietary').textContent=dc;_dc.style.display='';}else{_dc.style.display='none';}
        document.getElementById('summary-bar').style.display='';
        ['all','paid','unpaid'].forEach(f=>{var c=document.getElementById('card-'+f);if(c)c.classList.toggle('active',f===activeFilter);});
        _dc.classList.toggle('active',activeFilter==='dietary');
        return;
      }

      // Columns to display (hide Timestamp to reduce clutter; show if present)
      // We'll show all columns but put Timestamp last and make it smaller
      const paidCol  = col('paid');
      const nameCol  = col('name');
      const numCol   = col('how many') >= 0 ? col('how many') : col('number');
      const unitCol  = col('unit');
      const emailCol = col('email');
      const dietCol  = col('diet');
      const tsCol    = col('timestamp');

      // Build a sensible column order
      const displayCols = [];
      [nameCol, numCol, unitCol, emailCol, dietCol, paidCol, tsCol].forEach(i => {
        if (i >= 0 && !displayCols.includes(i)) displayCols.push(i);
      });
      // Add any remaining columns not yet included
      headers.forEach((_, i) => { if (!displayCols.includes(i) && i !== eventCol) displayCols.push(i); });

      // Update print heading
      const filterLabels = { all:'All Registrations', paid:'Paid Only', unpaid:'Unpaid Only', dietary:'Dietary Requirements' };
      const eventLabel = chosen === '__ALL__' ? 'All Events' : chosen;
      const printHeading = eventLabel + ' — ' + filterLabels[activeFilter];

      let html = '<div class="print-filter-heading" id="printFilterHeading">' + escHtml(printHeading) + '</div>';
      html += '<table><thead><tr>';
      displayCols.forEach(i => {
        html += `<th>${escHtml(headers[i] || '')}</th>`;
      });
      html += '</tr></thead><tbody>';

      displayRows.forEach(row => {
        html += '<tr>';
        displayCols.forEach(i => {
          const val = (row[i] || '').trim();
          if (i === paidCol) {
            const lower = val.toLowerCase();
            const cls   = lower === 'true' || lower === 'yes' || val === '✓' || val === 'TRUE'
                          ? 'paid-yes' : (val ? 'paid-no' : '');
            const label = lower === 'true' || val === 'TRUE' ? '✓ Yes'
                        : lower === 'false' || val === 'FALSE' ? '✗ No' : val;
            html += `<td class="${cls}">${escHtml(label)}</td>`;
          } else {
            html += `<td>${escHtml(val)}</td>`;
          }
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      wrap.innerHTML = html;

      // ── Show and title the accordion ────────────────────────────────────
      const accWrap  = document.getElementById('accordion-wrap');
      const accTitle = document.getElementById('accordion-title');
      if (accWrap) accWrap.style.display = '';
      if (accTitle) {
        const label = chosen === '__ALL__' ? 'All Events' : chosen;
        accTitle.textContent = label + ' — ' + (displayRows.length) + ' registration' + (displayRows.length === 1 ? '' : 's');
      }
      openAccordion();

      // ── Summary totals (always from full event set, not sub-filtered) ──────
      let totalPeople = 0, paidPeople = 0, unpaidPeople = 0, dietaryCount = 0;
      filtered.forEach(row => {
        const num    = parseInt(row[numCol] || '1', 10) || 1;
        const paid   = (row[paidCol] || '').trim().toLowerCase();
        const diet   = (row[dietCol] || '').trim();
        const isPaid = paid === 'true' || paid === 'yes' || paid === '✓';
        totalPeople  += num;
        if (isPaid) paidPeople += num; else unpaidPeople += num;
        if (diet) dietaryCount++;
      });

      document.getElementById('sum-total').textContent   = totalPeople;
      document.getElementById('sum-paid').textContent    = paidPeople;
      document.getElementById('sum-unpaid').textContent  = unpaidPeople;

      const dietCard = document.getElementById('sum-dietary-card');
      if (dietaryCount > 0) {
        document.getElementById('sum-dietary').textContent = dietaryCount;
        dietCard.style.display = '';
      } else {
        dietCard.style.display = 'none';
        if (activeFilter === 'dietary') { activeFilter = 'all'; }
      }
      document.getElementById('summary-bar').style.display = '';

      // Sync active state on cards
      ['all','paid','unpaid'].forEach(function(f) {
        var card = document.getElementById('card-' + f);
        if (card) card.classList.toggle('active', f === activeFilter);
      });
      if (dietCard) dietCard.classList.toggle('active', activeFilter === 'dietary');

      const n = displayRows.length;
      document.getElementById('row-count').textContent =
        n + ' registration' + (n === 1 ? '' : 's') +
        (activeFilter !== 'all' ? ' (filtered)' : '');
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadData();
  
  // ── Smart back navigation ─────────────────────────────────────────────────
  function smartBack() { history.back(); }
</script>
</body>
</html>
