<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Village Issues & Progress | Bridgeman Downs Residents Hub</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#f5f5f5; display:flex; flex-direction:column; height:100vh; }

    .top-bar {
      background:#1F4E79; padding:12px 20px;
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:10px; flex-shrink:0;
    }
    .top-bar-title { color:white; font-size:1em; font-weight:700; }
    .top-bar-sub { color:rgba(255,255,255,0.72); font-size:0.8em; margin-top:2px; }
    .btn-group { display:flex; gap:8px; flex-shrink:0; }
    .back-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:white; color:#1F4E79; padding:9px 16px;
      border-radius:7px; text-decoration:none; font-weight:700;
      font-size:0.88em; border:2px solid white; white-space:nowrap;
      transition:background 0.2s;
    }
    .back-btn:hover { background:#E7F1FB; }
    .print-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(255,255,255,0.15); color:white;
      padding:9px 16px; border-radius:7px; font-weight:700;
      font-size:0.88em; cursor:pointer;
      border:2px solid rgba(255,255,255,0.4); white-space:nowrap;
      transition:background 0.2s;
    }
    .print-btn:hover { background:rgba(255,255,255,0.25); }

    .tab-bar {
      background:#163d5f; padding:0 16px;
      display:flex; gap:4px; flex-shrink:0; overflow-x:auto;
    }
    .tab-btn {
      padding:10px 16px; color:rgba(255,255,255,0.7);
      font-size:0.88em; font-weight:600; cursor:pointer;
      border:none; background:transparent;
      border-bottom:3px solid transparent;
      white-space:nowrap; transition:all 0.2s;
    }
    .tab-btn:hover { color:white; }
    .tab-btn.active { color:white; border-bottom-color:#C9A44A; }

    .info-bar {
      background:#E7F1FB; border-bottom:2px solid #c5d8ee;
      padding:7px 20px; font-size:0.82em; color:#1F4E79; flex-shrink:0;
    }

    .sheet-frame {
      flex:1; width:100%; border:none; display:block;
      background:white; min-height:0;
    }

    @media(max-width:600px){
      .top-bar { padding:10px 14px; }
      .back-btn, .print-btn { font-size:0.8em; padding:8px 12px; }
      .tab-btn { padding:8px 12px; font-size:0.82em; }
    }
    @media print {
      .top-bar, .tab-bar, .info-bar { display:none !important; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <div class="top-bar-title">&#128202; Village Issues &amp; Progress</div>
      <div class="top-bar-sub">Bridgeman Downs Retirement Village &#8212; read only</div>
    </div>
    <div class="btn-group">
      <button class="print-btn" onclick="window.print()">&#128424;&#65039; Print</button>
      <a class="back-btn" href="community-info.html">&#8592; Back</a>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active"  onclick="showTab(this,'1978582396')">&#128203; Progress Board</button>
    <button class="tab-btn"         onclick="showTab(this,'320932933')">&#128269; Issues</button>
    <button class="tab-btn"         onclick="showTab(this,'744455173')">&#128065;&#65039; At a Glance</button>
    <button class="tab-btn"         onclick="showTab(this,'1044575149')">&#128640; Initiatives</button>
  </div>

  <div class="info-bar">
    &#128161; Use the buttons above to switch between sections. Content updates automatically when the tracker is changed.
  </div>

  <iframe
    id="sheetFrame"
    class="sheet-frame"
    src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQt0zn_YGht1WjyIMAHr5cueFGcpXwTPOeD8gSDvbNguhp27fD6MhPHqxa8sN0aNFTFYNZkm1wupcMW/pubhtml?gid=1978582396&single=true&widget=false&headers=false"
    title="Village Issues and Progress Tracker">
  </iframe>

<script>
  var BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQt0zn_YGht1WjyIMAHr5cueFGcpXwTPOeD8gSDvbNguhp27fD6MhPHqxa8sN0aNFTFYNZkm1wupcMW/pubhtml?single=true&widget=false&headers=false&gid=';
  function showTab(btn, gid) {
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('sheetFrame').src = BASE + gid;
  }
</script>

</body>
</html>
