<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Viewer | Bridgeman Downs Residents Hub</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#f5f5f5; display:flex; flex-direction:column; height:100vh; }

    .top-bar {
      background:#1F4E79;
      padding:12px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:10px;
      flex-shrink:0;
    }

    .top-bar-info { min-width:0; }

    .top-bar-title {
      color:white;
      font-size:1em;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:60vw;
    }

    .top-bar-sub {
      color:rgba(255,255,255,0.72);
      font-size:0.8em;
      margin-top:2px;
    }

    .btn-group {
      display:flex;
      gap:8px;
      flex-shrink:0;
    }

    .back-btn {
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:white;
      color:#1F4E79;
      padding:9px 16px;
      border-radius:7px;
      text-decoration:none;
      font-weight:700;
      font-size:0.88em;
      border:2px solid white;
      transition:background 0.2s;
      white-space:nowrap;
    }
    .back-btn:hover{ background:#E7F1FB; }

    .print-btn {
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:rgba(255,255,255,0.15);
      color:white;
      padding:9px 16px;
      border-radius:7px;
      text-decoration:none;
      font-weight:700;
      font-size:0.88em;
      border:2px solid rgba(255,255,255,0.4);
      cursor:pointer;
      transition:background 0.2s;
      white-space:nowrap;
    }
    .print-btn:hover{ background:rgba(255,255,255,0.25); }

    .info-bar {
      background:#E7F1FB;
      border-bottom:2px solid #c5d8ee;
      padding:8px 20px;
      font-size:0.83em;
      color:#1F4E79;
      flex-shrink:0;
    }

    .doc-frame {
      flex:1;
      width:100%;
      border:none;
      display:block;
      background:white;
      min-height:0;
    }

    .error-msg {
      display:none;
      padding:40px 20px;
      text-align:center;
      color:#666;
      font-size:0.95em;
    }

    @media(max-width:600px){
      .top-bar { padding:10px 14px; }
      .top-bar-title { font-size:0.88em; max-width:55vw; }
      .back-btn, .print-btn { font-size:0.8em; padding:8px 12px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-info">
      <div class="top-bar-title" id="docTitle">Loading document...</div>
      <div class="top-bar-sub">Bridgeman Downs Retirement Village — Residents Hub</div>
    </div>
    <div class="btn-group">
      <button class="print-btn" onclick="printDocument()">🖨️ Print</button>
      <button class="back-btn" onclick="goBack()">← Back</button>
    </div>
  </div>

  <div class="info-bar">
    💡 This document is read-only. Use the <strong>Print</strong> button to print, or <strong>Back</strong> to return to the Residents Hub.
  </div>

  <iframe
    class="doc-frame"
    id="docFrame"
    title="Document viewer"
    allowfullscreen>
  </iframe>

  <div class="error-msg" id="errorMsg">
    ⚠️ This document could not be loaded. It may not be publicly accessible.<br><br>
    <a href="#" onclick="goBack();return false;" style="color:#1F4E79;font-weight:700;">← Return to Residents Hub</a>
  </div>

<script>
  var fileId = '';
  var returnUrl = '';

  // Go back to wherever the resident came from
  function goBack() {
    if (returnUrl) {
      window.location.href = returnUrl;
    } else {
      window.location.href = 'index.html';
    }
  }

  // Print the document — opens PDF directly in browser for native print dialog
  function printDocument() {
    if (fileId) {
      // Opens the PDF directly — browser shows it with its own Print button (1 click)
      window.open('https://drive.google.com/uc?export=download&id=' + fileId, '_blank');
    }
  }

  (function() {
    // Parse URL parameters
    function getParam(name) {
      var url = new URL(window.location.href);
      return url.searchParams.get(name) || '';
    }

    fileId    = getParam('id');
    var title = getParam('title');

    // Store where we came from so the Back button works reliably
    returnUrl = document.referrer || 'index.html';

    // Set page title
    var displayTitle = title || 'Village Document';
    document.getElementById('docTitle').textContent = displayTitle;
    document.title = displayTitle + ' | Bridgeman Downs Residents Hub';

    // Build the iframe src
    if (fileId) {
      var src = 'https://drive.google.com/file/d/' + fileId + '/preview';
      document.getElementById('docFrame').src = src;
    } else {
      // No file ID — show error
      document.getElementById('docFrame').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'block';
    }
  })();
</script>

</body>
</html>
